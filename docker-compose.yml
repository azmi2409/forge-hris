# forge-hris — local / single-host deployment (components 1-4: core platform, time tracking, leave, agent surface).
#
# Usage:
#   cp .env.example .env   # optional; sane defaults are built in
#   docker compose up -d
#
# This starts:
#   postgres — Postgres 16, data in the pgdata volume. The schema
#              migrations (store/migrations/001_init.sql, 002_time.sql,
#              003_leave.sql, 004_webhooks.sql, 005_scim.sql) are applied on
#              first init via /docker-entrypoint-initdb.d.
#   api      — REST API on :8080. Applies the embedded schema migrations on
#              every boot (idempotent, so upgrades are safe). Starts the
#              webhook dispatcher goroutine.
#   mcp      — MCP server on :8081 (Streamable-HTTP style JSON-RPC at
#              POST /mcp, SSE at GET /mcp). Same bearer <redacted> model as the API.
#
# Endpoints once up:
#   http://localhost:8080/healthz        health check
#   http://localhost:8080/api/v1/...     REST API
#   http://localhost:8080/scim/v2/...    SCIM 2.0 (service-account tokens)
#   http://localhost:8081/mcp            MCP endpoint (POST JSON-RPC)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forge}
      POSTGRES_DB: ${POSTGRES_DB:-forge_hris}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./store/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forge} -d ${POSTGRES_DB:-forge_hris}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-forge}:${POSTGRES_PASSWORD:-forge}@postgres:5432/${POSTGRES_DB:-forge_hris}?sslmode=disable}
      PORT: "8080"
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mcp:
    build: .
    restart: unless-stopped
    entrypoint: ["forge-hris-mcp"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-forge}:${POSTGRES_PASSWORD:-forge}@postgres:5432/${POSTGRES_DB:-forge_hris}?sslmode=<redacted>
      FORGE_HRIS_MCP_TOKEN: ${FORGE_HRIS_MCP_TOKEN:-}
    ports:
      - "${MCP_PORT:-8081}:8081"
    command: ["forge-hris-mcp", "--addr", ":8081"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --post-data='{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"ping\"}' --header='Content-Type: application/json' http://localhost:8081/mcp | grep -q '\"id\":1'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
