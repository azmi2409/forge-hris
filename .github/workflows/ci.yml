name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build / vet / test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge_hris
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forge_hris"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test with race detector
        run: go test ./... -race -count=1

      - name: Test Postgres adapter
        env:
          TEST_DATABASE_URL: postgres://forge:forge@localhost:5432/forge_hris?sslmode=disable
        run: go test ./store/ -run TestPostgres -v -count=1
