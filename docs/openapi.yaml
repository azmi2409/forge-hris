    post:
      summary: Submit a pay period
      description: |
        Manager+ only. Open/Reopened/Rejected -> Submitted. Freezes the
        period's entries (409 PERIOD_LOCKED on writes) while awaiting a
        decision.
      operationId: submitPayPeriod
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: periodId
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          description: Period submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayPeriod'

  /api/v1/organizations/{orgId}/pay-periods/{periodId}/approve:
    post:
      summary: Approve a pay period
      description: |
        Manager+ only. Submitted -> Approved. Locks every entry the period
        covers (is_locked); reopening unlocks them.
      operationId: approvePayPeriod
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: periodId
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          description: Period approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayPeriod'

  /api/v1/organizations/{orgId}/pay-periods/{periodId}/reject:
    post:
      summary: Reject a pay period
      description: Manager+ only. Submitted -> Rejected (may be resubmitted).
      operationId: rejectPayPeriod
      parameters:
