openapi: 3.1.0
info:
  title: forge-hris API — components 1–3 (identity, tenancy, audit, time tracking, leave)
  version: 1.1.0
  description: |
    Core platform API for forge-hris: organizations, groups, employees, RBAC
    roles, credentials (PATs + service accounts), and the hash-chained audit log.

    Component 2 adds time tracking: clock in/out with breaks, manual time
    entries, hour entries, projects, pay-period lifecycle with approvals,
    shift scheduling, and overtime preview.

    Component 3 adds leave: time-off policies with accrual/carry-forward/expiry,
    leave requests with ordered approval chains, the balance ledger, holiday
    calendars, and who-is-on-leave.

    ## Authentication

    Every route requires `Authorization: Bearer <token>` except `GET /healthz`
    and the `POST /api/v1/organizations` bootstrap. Tokens are presented once
    at issuance; only their SHA-256 hash is stored. Personal access tokens
    inherit the employee's RBAC role; service accounts carry explicit scopes.

    ## Tenancy

    A credential is bound to exactly one organization. Every route carrying an
    `{orgId}` path parameter rejects a mismatch with `403 FORBIDDEN`.

    ## Errors

    All errors use a flat envelope with stable UPPER_SNAKE codes and echo the
    request ID (`X-Request-ID`) for log correlation:

        {"code":"NOT_FOUND","message":"...","details":{...},"request_id":"..."}

    The envelope codes `BAD_REQUEST` (malformed JSON), `VALIDATION_ERROR`,
    `UNAUTHENTICATED`, `FORBIDDEN`, `NOT_FOUND`, `ALREADY_EXISTS`,
    `VERSION_CONFLICT`, `IDEMPOTENCY_KEY_REUSED`, and `RATE_LIMITED` may
    appear on any route; `CANCELLED` and `INTERNAL` are reserved for
    cancelled requests and unexpected failures.

    ## Pagination

    List routes return `{data, next_cursor, has_more}`. `limit` defaults to 100
    and is clamped to 1000; `cursor` is the opaque token from the previous
    page's `next_cursor`.

    ## Idempotency

    All POSTs accept an `Idempotency-Key` header. A repeated key with the same
    request replays the stored response; with a different request body it is
    rejected with `409 IDEMPOTENCY_KEY_REUSED`. Keys are scoped per
    organization and expire after 24h. The unauthenticated bootstrap route is
    not idempotent — a retried bootstrap collides on the slug with
    `409 ALREADY_EXISTS`.

    ## Rate limiting

    100 requests/minute per credential. Exceeding it returns `429 RATE_LIMITED`
    with a `Retry-After` header (seconds).

    ## Bootstrap flow

    1. `POST /api/v1/organizations` with `{name, slug, country_code, owner}`
       (no auth). The response contains the organization, the owner employee,
       the owner PAT credential, and `token` — the plaintext, shown once.
    2. Use the token as `Authorization: Bearer <token>` for all further calls.
servers:
  - url: http://localhost:8080
    description: Local development

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      summary: Health check
      description: Returns service liveness. No authentication required.
      security: []
      operationId: healthz
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/organizations:
    post:
      summary: Bootstrap an organization
      description: |
        Creates an organization, its owner employee (status `joined`), the
        owner membership, and a personal access token for the owner. No
        authentication required — this is how the first credential is minted.
        The response includes `token`, the plaintext bearer token, shown
        exactly once. Not idempotent: retrying with the same slug returns
        `409 ALREADY_EXISTS`. The owner is assigned a generated employee
        number (`EMP-<8 hex>`) since the bootstrap request carries none.
      security: []
      operationId: bootstrapOrganization
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
      responses:
        '201':
          description: Organization bootstrapped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/AlreadyExists'
    get:
      summary: Get the caller's organization
      description: |
        Returns the organization the caller's credential belongs to, wrapped
        in the standard page envelope. There is no cross-tenant listing.
      operationId: listOrganizations
      responses:
        '200':
          description: The caller's organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationList'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/organizations/{orgId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      summary: Get an organization
      operationId: getOrganization
      responses:
        '200':
          description: The organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update an organization
      description: |
        Partial update with optimistic concurrency: `version` is required and
        must match the current version, otherwise `409 VERSION_CONFLICT`.
        Requires owner or admin.
      operationId: patchOrganization
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                name:
                  type: string
                version:
                  type: integer
                  format: int64
                  description: Current version from a prior GET; required.
      responses:
        '200':
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Version conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                versionConflict:
                  value:
                    code: VERSION_CONFLICT
                    message: resource changed since it was read; GET it again and retry
                    request_id: abc123

  /api/v1/organizations/{orgId}/groups:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    post:
      summary: Create a group
      description: Requires manager or higher.
      operationId: createGroup
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                parent_id:
                  type: string
                  description: Parent group ID; empty string clears.
      responses:
        '201':
          description: Created group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyKeyReused'
    get:
      summary: List groups
      operationId: listGroups
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/organizations/{orgId}/groups/{groupId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - name: groupId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get a group
      operationId: getGroup
      responses:
        '200':
          description: The group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update a group
      description: Requires manager or higher. `version` is required; stale versions return `409 VERSION_CONFLICT`.
      operationId: patchGroup
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                name:
                  type: string
                parent_id:
                  type: string
                  description: Parent group ID; empty string clears.
                version:
                  type: integer
                  format: int64
      responses:
        '200':
          description: Updated group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
    delete:
      summary: Delete a group
      description: Requires manager or higher. Fails with `409 GROUP_NOT_EMPTY` when employees are still assigned to the group.
      operationId: deleteGroup
      responses:
        '204':
          description: Group deleted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Group still has members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notEmpty:
                  value:
                    code: GROUP_NOT_EMPTY
                    message: group still has members assigned
                    request_id: abc123

  /api/v1/organizations/{orgId}/employees:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    post:
      summary: Create an employee
      description: |
        Requires owner or admin. `employee_number` is generated as `EMP-<8 hex>`
        when omitted (it must be unique per organization; pass your own value
        to use an HR-assigned scheme). The member role is granted automatically
        only when the employee is already `joined`; otherwise grant it later
        via `PUT /roles/{employeeId}` once they join.
      operationId: createEmployee
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
      responses:
        '201':
          description: Created employee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyKeyReused'
    get:
      summary: List employees
      description: Requires the `employees:read` scope.
      operationId: listEmployees
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: group_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          description: Invitation status filter.
          schema:
            type: string
        - name: q
          in: query
          description: Free-text search over name/email/employee number.
          schema:
            type: string
      responses:
        '200':
          description: Paginated employees
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/organizations/{orgId}/employees/{employeeId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get an employee
      description: |
        Requires the `employees:read` scope. Members may only read their own
        record; reading anyone else's returns `403 FORBIDDEN`.
      operationId: getEmployee
      responses:
        '200':
          description: The employee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update an employee
      description: Requires owner or admin. `version` is required; stale versions return `409 VERSION_CONFLICT`. Send empty string for `group_id`/`manager_id` to unassign.
      operationId: patchEmployee
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                  format: email
                position:
                  type: string
                employment_type:
                  type: string
                  enum: [full_time, part_time, contract, intern]
                group_id:
                  type: string
                manager_id:
                  type: string
                time_zone:
                  type: string
                  example: Asia/Jakarta
                work_start_date:
                  type: string
                  format: date-time
                version:
                  type: integer
                  format: int64
      responses:
        '200':
          description: Updated employee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'

  /api/v1/organizations/{orgId}/employees/{employeeId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Deactivate an employee
      description: Soft-deactivate. Requires owner or admin. `version` is required; stale versions return `409 VERSION_CONFLICT`.
      operationId: deactivateEmployee
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: integer
                  format: int64
      responses:
        '200':
          description: Deactivated employee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'

  /api/v1/organizations/{orgId}/roles:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      summary: List role memberships
      description: Requires owner or admin.
      operationId: listMemberships
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated memberships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/organizations/{orgId}/roles/{employeeId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Assign a role
      description: |
        Requires owner or admin. Owners may assign any role; admins may only
        assign `manager` or `member` — assigning `owner`/`admin` as an admin
        returns `403 FORBIDDEN`.
      operationId: setRole
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: Role assigned
          content:
            application/json:
              schema:
                type: object
                required: [employee_id, role]
                properties:
                  employee_id:
                    type: string
                  role:
                    $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/organizations/{orgId}/credentials:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    post:
      summary: Issue a credential
      description: |
        Requires owner or admin. Issues either a personal access token
        (`kind: pat`, bound to a joined employee; scopes are derived from the
        employee's role and must not be sent) or a service account
        (`kind: service_account`, with explicit validated scopes).

        The response includes `token`, the plaintext bearer token, shown
        exactly once — only its SHA-256 hash is stored and it can never be
        retrieved again.

        `payroll:submit` may only be granted by an owner; any other caller
        requesting it receives `403 FORBIDDEN`.
      operationId: issueCredential
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCredentialRequest'
      responses:
        '201':
          description: Issued credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialIssuance'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyKeyReused'
    get:
      summary: List credentials
      description: Requires owner or admin. Token hashes and plaintext tokens are never exposed.
      operationId: listCredentials
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/organizations/{orgId}/credentials/{credentialId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - name: credentialId
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Revoke a credential
      description: Requires owner or admin. Revocation is immediate; the token stops authenticating.
      operationId: revokeCredential
      responses:
        '204':
          description: Credential revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/organizations/{orgId}/audit_events:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      summary: List audit events
      description: |
        Requires the `audit:read` scope. Events are append-only and
        hash-chained; each carries actor, action, resource, before/after
        snapshots, and the idempotency key when the mutation was idempotent.
      operationId: listAuditEvents
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: actor_type
          in: query
          schema:
            $ref: '#/components/schemas/ActorType'
        - name: action
          in: query
          description: e.g. employee.created
          schema:
            type: string
        - name: resource_type
          in: query
          schema:
            type: string
        - name: since
          in: query
          description: RFC3339 lower bound on event time.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Paginated audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/organizations/{orgId}/clock-in:
    post:
      summary: Clock in
      description: |
        Creates an `in` time entry for the employee. Exactly one open entry
        may exist per employee: clocking in twice returns 409
        ALREADY_CLOCKED_IN. Requires an Idempotency-Key header.
      operationId: clockIn
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClockRequest'
      responses:
        '201':
          description: Clocked in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Already clocked in, or the entry falls in a frozen pay period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/organizations/{orgId}/clock-out:
    post:
      summary: Clock out
      description: |
        Creates an `out` time entry closing the employee's open entry.
        404 when no entry is open. Requires an Idempotency-Key header.
      operationId: clockOut
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClockRequest'
      responses:
        '201':
          description: Clocked out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'

  /api/v1/organizations/{orgId}/breaks/start:
    post:
      summary: Start a break
      description: |
        Creates a `start_break` entry. Requires a working open entry
        (kind `in` or `end_break`); otherwise 409 INVALID_TRANSITION.
        Requires an Idempotency-Key header.
      operationId: startBreak
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClockRequest'
      responses:
        '201':
          description: Break started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'

  /api/v1/organizations/{orgId}/breaks/end:
    post:
      summary: End a break
      description: |
        Creates an `end_break` entry. Requires an open `start_break`;
        otherwise 409 INVALID_TRANSITION. Requires an Idempotency-Key header.
      operationId: endBreak
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClockRequest'
      responses:
        '201':
          description: Break ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'

  /api/v1/organizations/{orgId}/time-entries:
    get:
      summary: List time entries
      description: |
        Cursor-paginated. Shows head entries only (superseded rows excluded)
        unless `include_history=true`; soft-deleted rows excluded unless
        `include_deleted=true`. Members are restricted to their own entries.
      operationId: listTimeEntries
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: employee_id
          in: query
          schema: {type: string}
        - name: kind
          in: query
          schema: {$ref: '#/components/schemas/TimeEntryKind'}
        - name: from
          in: query
          description: RFC3339 lower bound on occurred_at
          schema: {type: string, format: date-time}
        - name: to
          in: query
          description: RFC3339 exclusive upper bound on occurred_at
          schema: {type: string, format: date-time}
        - name: include_deleted
          in: query
          schema: {type: boolean, default: false}
        - name: include_history
          in: query
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Paginated time entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntryPage'
    post:
      summary: Create a manual time entry (backfill)
      description: |
        Stores a punch without enforcing the clock state machine.
        Manager+ only; members punch through the clock endpoints.
      operationId: createTimeEntry
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTimeEntryRequest'
      responses:
        '201':
          description: Entry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'

  /api/v1/organizations/{orgId}/time-entries/{entryId}:
    get:
      summary: Get a time entry
      operationId: getTimeEntry
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: entryId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: The entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'
    patch:
      summary: Patch a time entry
      description: |
        Sparse update (occurred_at, project/activity/location, GPS, address,
        client_type). Only when the entry is mutable: not locked and not
        inside a submitted/approved pay period, otherwise 409 PERIOD_LOCKED.
        Kind changes go through /correct.
      operationId: patchTimeEntry
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: entryId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchTimeEntryRequest'
      responses:
        '200':
          description: Entry updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'

  /api/v1/organizations/{orgId}/time-entries/{entryId}/correct:
    post:
      summary: Correct a time entry
      description: |
        Corrections, never edits: freezes the original entry (is_locked,
        linked forward via next_id) and creates a superseding head entry
        linked back via prev_id. The original must be a head entry and
        mutable, otherwise 409 INVALID_TRANSITION / PERIOD_LOCKED.
      operationId: correctTimeEntry
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: entryId
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectTimeEntryRequest'
      responses:
        '201':
          description: Superseding entry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'

