      operationId: getLeavePolicy
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: policyId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeOffPolicy' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update a time-off policy
      description: Optimistic concurrency — `version` must match the stored version.
      operationId: updateLeavePolicy
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: policyId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                name: { type: string }
                accrual_mode:
                  type: string
                  enum: [annually, monthly, pay_period, payroll_hours]
                accrual_amount: { type: number }
                carry_forward_cap: { type: number }
                expiry_months: { type: integer }
                version: { type: integer, description: Must match the stored version. }
      responses:
        '200':
          description: Policy updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeOffPolicy' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
    delete:
      summary: Delete a time-off policy
      description: Only when no requests or balances reference it (else 409 POLICY_NOT_EMPTY).
      operationId: deleteLeavePolicy
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: policyId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Policy deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NotEmpty' }

  /api/v1/organizations/{orgId}/leave-balances:
    get:
      summary: List leave balances
      description: Filter by employee_id, policy_id, period (YYYY).
      operationId: listLeaveBalances
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: employee_id
          in: query
          schema: { type: string }
        - name: policy_id
          in: query
          schema: { type: string }
        - name: period
          in: query
          description: Annual period label, e.g. 2026.
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated balances
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveBalanceList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/organizations/{orgId}/leave-balances/recalculate:
    post:
      summary: Recalculate a leave balance
      description: |
        Recomputes the employee's balance for as_of's year from the policy,
        tenure, and paid requested/approved requests (working days via the
        optional holiday calendar), applies carry-forward from the stored
        previous-period balance and expiry, then upserts the result.
        Idempotent: same inputs, same stored balance. Members may only
        recalculate their own balance.
      operationId: recalculateLeaveBalance
      parameters:
        - $ref: '#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employee_id, policy_id]
              properties:
                employee_id: { type: string }
                policy_id: { type: string }
                as_of:
                  type: string
                  format: date-time
                  description: Defaults to now.
                holiday_calendar_id:
                  type: string
                  description: Holidays excluded from working-day counts.
      responses:
        '200':
          description: Recalculated balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveBalance' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/organizations/{orgId}/leave-requests:
    post:
      summary: Create a leave request
      description: |
        Creates a request with status `requested`. `days` is computed
        server-side from dates and holidays. Paid requests check the
        recalculated balance (409 INSUFFICIENT_BALANCE when short); unpaid
        requests skip the check (component 5 deducts them from pay instead).
        The approval chain defaults to the employee's manager; an explicit
        `approver_ids` chain requires manager role or higher. A snapshot of
        the policy rules and the balance at request time is frozen onto the
        request. Members may only request for themselves.
      operationId: createLeaveRequest
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employee_id, policy_id, start_date, end_date]
              properties:
                employee_id: { type: string }
                policy_id: { type: string }
                start_date: { type: string, format: date, example: '2026-12-24' }
                end_date: { type: string, format: date, example: '2026-12-31' }
                is_unpaid: { type: boolean, default: false }
                holiday_calendar_id: { type: string }
                approver_ids:
                  type: array
                  items: { type: string }
                  description: Ordered approver chain; overrides the manager default.
      responses:
        '201':
          description: Request created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeOffRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InsufficientBalance' }
    get:
      summary: List leave requests
      description: Filter by employee_id, policy_id, status.
      operationId: listLeaveRequests
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: employee_id
          in: query
          schema: { type: string }
        - name: policy_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [requested, approved, rejected, cancelled]
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated requests
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeOffRequestList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/organizations/{orgId}/leave-requests/bulk-approve:
    post:
      summary: Bulk-approve leave requests (two-phase)
      description: |
        Two-phase: `{ids, preview: true}` returns per-request approvability
        without mutating; `{ids, preview: false}` approves every listed
        request or none (all-or-nothing; 409 BULK_APPROVAL_FAILED with
        per-request reasons when any request fails). The confirm accepts
        Idempotency-Key and is idempotent. Requires the leave:approve scope;
        each request must be decidable by the caller (current chain approver
        or admin).
      operationId: bulkApproveLeaveRequests
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: string }
                preview: { type: boolean, default: false }
      responses:
        '200':
          description: Preview results, or the approved requests on confirm
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BulkApprovePreview'
                  - $ref: '#/components/schemas/BulkApproveResult'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/BulkApprovalFailed' }

  /api/v1/organizations/{orgId}/leave-requests/{id}:
    get:
      summary: Get a leave request
      operationId: getLeaveRequest
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeOffRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update a leave request
      description: Only `requested` requests can be edited (409 INVALID_TRANSITION otherwise). `version` must match.
      operationId: updateLeaveRequest
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                start_date: { type: string, format: date }
                end_date: { type: string, format: date }
                is_unpaid: { type: boolean }
                holiday_calendar_id: { type: string }
                version: { type: integer }
      responses:
        '200':
          description: Request updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeOffRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }

  /api/v1/organizations/{orgId}/leave-requests/{id}/cancel:
    post:
      summary: Cancel a leave request
      description: Allowed from `requested` or `approved`. Members may only cancel their own.
      operationId: cancelLeaveRequest
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer }
      responses:
        '200':
          description: Request cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeOffRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }

  /api/v1/organizations/{orgId}/leave-requests/{id}/approve:
    post:
      summary: Approve a leave request (chain-aware)
      description: |
        Requires the leave:approve scope AND being the current pending
        approver (or admin). Approving advances the chain; when no pending
        steps remain the request becomes `approved`.
      operationId: approveLeaveRequest
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, description: Request version for optimistic concurrency. }
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalDecision' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NotCurrentApprover' }

  /api/v1/organizations/{orgId}/leave-requests/{id}/reject:
    post:
      summary: Reject a leave request (chain-aware)
      description: |
        Requires the leave:approve scope AND being the current pending
        approver (or admin). Any rejection makes the request `rejected`
        (short-circuits the chain).
      operationId: rejectLeaveRequest
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer }
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalDecision' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NotCurrentApprover' }

  /api/v1/organizations/{orgId}/leave-requests/{id}/approvals:
    get:
      summary: List a request's approval chain
      description: Steps ordered by sequence; the current step is the lowest-sequence pending one.
      operationId: listLeaveApprovals
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated approval steps
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeOffApprovalList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Append an approval step
      description: Requires manager role or higher. Only on `requested` requests.
      operationId: addLeaveApproval
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approver_employee_id]
              properties:
                approver_employee_id: { type: string }
                sequence:
                  type: integer
                  description: 1-based; omitted auto-assigns max+1.
      responses:
        '201':
          description: Step created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeOffApproval' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }

  /api/v1/organizations/{orgId}/holiday-calendars:
    post:
      summary: Create a holiday calendar
      operationId: createHolidayCalendar
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, country_code]
              properties:
                name: { type: string, example: Malaysia Public Holidays }
                country_code: { type: string, enum: [MY, ID] }
      responses:
        '201':
          description: Calendar created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HolidayCalendar' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      summary: List holiday calendars
      operationId: listHolidayCalendars
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated calendars
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HolidayCalendarList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/organizations/{orgId}/holiday-calendars/{calendarID}:
    get:
      summary: Get a holiday calendar
      operationId: getHolidayCalendar
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: calendarID
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The calendar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HolidayCalendar' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update a holiday calendar
      operationId: updateHolidayCalendar
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: calendarID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                name: { type: string }
                country_code: { type: string, enum: [MY, ID] }
                version: { type: integer }
      responses:
        '200':
          description: Calendar updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HolidayCalendar' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
    delete:
      summary: Delete a holiday calendar
      description: Only when it has no holidays (else 409 CALENDAR_NOT_EMPTY).
      operationId: deleteHolidayCalendar
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: calendarID
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Calendar deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NotEmpty' }

  /api/v1/organizations/{orgId}/holiday-calendars/{calendarID}/holidays:
    post:
      summary: Add a holiday
      description: (calendar_id, date) must be unique.
      operationId: createHoliday
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: calendarID
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, name]
              properties:
                date: { type: string, format: date, example: '2026-01-01' }
                name: { type: string, example: New Year's Day }
      responses:
        '201':
          description: Holiday created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Holiday' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AlreadyExists' }
    get:
      summary: List holidays
      description: Ordered by date.
      operationId: listHolidays
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: calendarID
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated holidays
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HolidayList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/organizations/{orgId}/holiday-calendars/{calendarID}/holidays/{holidayID}:
    delete:
      summary: Delete a holiday
      operationId: deleteHoliday
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: calendarID
          in: path
          required: true
          schema: { type: string }
        - name: holidayID
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Holiday deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/organizations/{orgId}/who-is-on-leave:
    get:
      summary: Who is on leave
      description: Approved leave requests (paid and unpaid) overlapping the date.
      operationId: whoIsOnLeave
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: date
          in: query
          description: YYYY-MM-DD; defaults to today (UTC).
          schema: { type: string, format: date }
      responses:
        '200':
          description: People on leave
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WhoIsOnLeave' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Personal access token or service-account token. Minted via the
        bootstrap (`POST /api/v1/organizations`) or
        `POST /api/v1/organizations/{orgId}/credentials`. The plaintext is
        shown once at issuance; present it as `Authorization: Bearer <token>`.
        A PAT authenticates only while its employee's status is `joined` —
        deactivating the employee immediately invalidates the token.

  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      description: Organization ID. Must match the caller's organization.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 100
        maximum: 1000
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's next_cursor.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Key for idempotent POSTs. Repeating a key with the same request
        replays the stored response; with a different request body it returns
        409 IDEMPOTENCY_KEY_REUSED.
      schema:
        type: string

  responses:
    Unauthenticated:
      description: Missing, invalid, expired, or revoked credential.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthenticated:
              value:
                code: UNAUTHENTICATED
                message: invalid, expired, or revoked credential
                request_id: abc123
    Forbidden:
      description: Authenticated but not permitted (role, scope, own-record, or cross-tenant violation).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              value:
                code: FORBIDDEN
                message: requires admin role or higher to update employees
                request_id: abc123
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              value:
                code: NOT_FOUND
                message: employee not found
                request_id: abc123
    ValidationError:
      description: Request failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validation:
              value:
                code: VALIDATION_ERROR
                message: "version: required and must be positive"
                details:
                  field: version
                request_id: abc123
    AlreadyExists:
      description: Unique constraint violated (e.g. organization slug).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            alreadyExists:
              value:
                code: ALREADY_EXISTS
                message: organization slug already taken
                request_id: abc123
    VersionConflict:
      description: Optimistic-concurrency conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            versionConflict:
              value:
                code: VERSION_CONFLICT
                message: resource changed since it was read; GET it again and retry
                request_id: abc123
    IdempotencyKeyReused:
      description: Idempotency key already used with a different request body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            reused:
              value:
                code: IDEMPOTENCY_KEY_REUSED
                message: idempotency key was already used with a different request
                request_id: abc123
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          description: Seconds until the window resets.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              value:
                code: RATE_LIMITED
                message: "rate limit exceeded: 100 requests/minute per credential"
                request_id: abc123

    BadRequest:
      description: Malformed JSON or a failed validation (VALIDATION_ERROR envelope).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            malformed:
              value:
                code: BAD_REQUEST
                message: 'invalid JSON: unexpected end of JSON input'
                request_id: abc123
            validation:
              value:
                code: VALIDATION_ERROR
                message: 'version: required and must be positive'
                request_id: abc123

    InsufficientBalance:
      description: Paid request exceeds the available balance.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            insufficient:
              value:
                code: INSUFFICIENT_BALANCE
                message: 'store: insufficient leave balance: need 5.00 days, have 3.00'
                request_id: abc123

    NotCurrentApprover:
      description: Caller is not the current pending approver (and not an admin).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notApprover:
              value:
                code: NOT_CURRENT_APPROVER
                message: 'store: not the current approver: current approver is <id>'
                request_id: abc123

    InvalidTransition:
      description: Status change not allowed from the current status.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid:
              value:
                code: INVALID_TRANSITION
                message: 'store: invalid status transition: cannot cancel a rejected request'
                request_id: abc123

    BulkApprovalFailed:
      description: Bulk approval failed for at least one request; nothing was applied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            bulkFailed:
              value:
                code: BULK_APPROVAL_FAILED
                message: 'bulk approval failed; nothing was applied'
                details:
                  results:
                    - request_id: req-1
                      approved: true
                    - request_id: req-2
                      approved: false
                      reason: not the current approver
                request_id: abc123

    NotEmpty:
      description: Resource still has dependents and cannot be deleted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notEmpty:
              value:
                code: GROUP_NOT_EMPTY
                message: policy still has leave requests
                request_id: abc123


  schemas:
    Error:
      title: Flat error envelope
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: Stable UPPER_SNAKE error code.
          example: NOT_FOUND
        message:
          type: string
          example: employee not found
        details:
          type: object
          description: Machine-readable extra context (e.g. the failing field).
          additionalProperties: true
        request_id:
          type: string
          description: Echo of the X-Request-ID response header for log correlation.
          example: abc123

    Role:
      type: string
      enum: [owner, admin, manager, member]

    ActorType:
      type: string
      enum: [human, agent, system, scim]

    CredentialKind:
      type: string
      enum: [pat, service_account]

    Scope:
      type: string
      enum:
        - time:read
        - time:write
        - leave:read
        - leave:write
        - leave:approve
        - payroll:read
        - payroll:preview
        - payroll:submit
        - employees:read
        - audit:read

    Organization:
      type: object
      required: [id, name, slug, country_code, created_at, updated_at, version]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        country_code:
          type: string
          example: ID
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int64

    OrganizationList:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        next_cursor:
          type: string
        has_more:
          type: boolean

    BootstrapRequest:
      type: object
      required: [name, slug, country_code, owner]
      properties:
        name:
          type: string
          example: Acme Corp
        slug:
          type: string
          example: acme
        country_code:
          type: string
          example: ID
        owner:
          type: object
          required: [first_name, last_name, email]
          properties:
            first_name:
              type: string
            last_name:
              type: string
            email:
              type: string
              format: email

    BootstrapResponse:
      type: object
      required: [organization, employee, credential, token]
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
        employee:
          $ref: '#/components/schemas/Employee'
        credential:
          $ref: '#/components/schemas/Credential'
        token:
          type: string
          description: Plaintext bearer token, shown exactly once.
          example: hris_...

    Group:
      type: object
      required: [id, organization_id, name, created_at, updated_at, version]
      properties:
        id:
          type: string
        organization_id:
          type: string
        name:
          type: string
        parent_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int64

    GroupList:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Group'
        next_cursor:
          type: string
        has_more:
          type: boolean

    Employee:
      type: object
      required: [id, organization_id, first_name, last_name, email, status, created_at, updated_at, version]
      properties:
        id:
          type: string
        organization_id:
          type: string
        employee_number:
          type: string
          description: Unique per organization. Generated as EMP-<8 hex> when omitted.
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        position:
          type: string
        employment_type:
          type: string
          enum: [full_time, part_time, contract, intern]
        group_id:
          type: string
          nullable: true
        manager_id:
          type: string
          nullable: true
        time_zone:
          type: string
          example: Asia/Jakarta
        work_start_date:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [not_invited, pending_invitation, joined, removed]
          description: Invitation status. PATs authenticate only while joined.
          example: joined
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int64

    CreateEmployeeRequest:
      type: object
      required: [first_name, last_name, email]
      properties:
        employee_number:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        position:
          type: string
        employment_type:
          type: string
        group_id:
          type: string
        manager_id:
          type: string
        time_zone:
          type: string
          example: Asia/Jakarta
        work_start_date:
          type: string
          format: date-time

    EmployeeList:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Employee'
        next_cursor:
          type: string
        has_more:
          type: boolean

    Membership:
      type: object
      required: [organization_id, employee_id, role, created_at]
      properties:
        organization_id:
          type: string
        employee_id:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        granted_by:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    MembershipList:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
        next_cursor:
          type: string
        has_more:
          type: boolean

    Credential:
      type: object
      description: Public shape of a credential. The token hash is never exposed.
      required: [id, organization_id, kind, name, created_at, version]
      properties:
        id:
          type: string
        organization_id:
          type: string
        kind:
          $ref: '#/components/schemas/CredentialKind'
        name:
          type: string
        employee_id:
          type: string
          nullable: true
          description: Set for PATs; null for service accounts.
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/Scope'
        expires_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int64

    CredentialList:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Credential'
        next_cursor:
          type: string
        has_more:
          type: boolean

    CreateCredentialRequest:
      type: object
      required: [kind, name]
      properties:
        kind:
          $ref: '#/components/schemas/CredentialKind'
        name:
          type: string
          example: payroll-agent
        employee_id:
          type: string
          description: Required for PATs (employee must have joined status); must not be set for service accounts.
        scopes:
          type: array
          description: Required for service accounts; must not be set for PATs (scopes derive from the employee's role). `payroll:submit` may only be granted by an owner.
          items:
            $ref: '#/components/schemas/Scope'
        expires_at:
          type: string
          format: date-time
          description: Must be in the future.

    CredentialIssuance:
      type: object
      required: [credential, token]
      properties:
        credential:
          $ref: '#/components/schemas/Credential'
        token:
          type: string
          description: Plaintext bearer token, shown exactly once. Store it securely — it cannot be retrieved again.
          example: hris_...

    AuditEvent:
      type: object
      required: [id, organization_id, actor_type, actor_id, action, resource_type, resource_id, prev_hash, hash, created_at]
      properties:
        id:
          type: integer
          format: int64
        organization_id:
          type: string
        actor_type:
          $ref: '#/components/schemas/ActorType'
        actor_id:
          type: string
          description: Credential ID that performed the action (or "bootstrap" for system bootstrap events).
        on_behalf_of:
          type: string
          nullable: true
          description: Delegated identity for act_as flows.
        action:
          type: string
          example: employee.created
        resource_type:
          type: string
          example: employee
        resource_id:
          type: string
        before:
          description: JSON snapshot before the mutation; null on creation.
          nullable: true
        after:
          description: JSON snapshot after the mutation; null on deletion.
          nullable: true
        idempotency_key:
          type: string
          nullable: true
        prev_hash:
          type: string
          description: Hash of the previous event in the chain.
        hash:
          type: string
          description: Hash of this event, chaining to prev_hash.
        created_at:
          type: string
          format: date-time

    AuditEventList:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_cursor:
          type: string
        has_more:
          type: boolean

    TimeEntryKind:
      type: string
      enum: [in, out, start_break, end_break]

    TimeEntryClientType:
      type: string
      enum: [web, mobile, desktop, kiosk, ai_assistant]

    TimeEntry:
      type: object
      required: [id, organization_id, employee_id, kind, occurred_at, client_type, is_locked, version, created_at, updated_at]
      properties:
        id: {type: string}
        organization_id: {type: string}
        employee_id: {type: string}
        kind: {$ref: '#/components/schemas/TimeEntryKind'}
        occurred_at: {type: string, format: date-time}
        project_id: {type: string, nullable: true}
        activity_id: {type: string, nullable: true, description: Forward reference; activities land in a later component}
        location_id: {type: string, nullable: true, description: Forward reference; locations land in a later component}
        latitude: {type: number, nullable: true}
        longitude: {type: number, nullable: true}
        address: {type: string, nullable: true}
        client_type: {$ref: '#/components/schemas/TimeEntryClientType'}
        prev_id: {type: string, nullable: true, description: Correction chain backlink}
        next_id: {type: string, nullable: true, description: Set when superseded by a correction}
        is_locked: {type: boolean, description: Frozen by correction or pay-period approval}
        version: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        deleted_at: {type: string, format: date-time, nullable: true}

    TimeEntryPage:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/TimeEntry'}
        next_cursor: {type: string}
        has_more: {type: boolean}

    ClockRequest:
      type: object
      properties:
        employee_id:
          type: string
          description: Defaults to the caller's employee; members may only name themselves
        occurred_at:
          type: string
          format: date-time
          description: Defaults to now
        project_id: {type: string}
        activity_id: {type: string}
        location_id: {type: string}
        latitude: {type: number}
        longitude: {type: number}
        address: {type: string}
        client_type:
          $ref: '#/components/schemas/TimeEntryClientType'
          default: web

    CreateTimeEntryRequest:
      allOf:
        - $ref: '#/components/schemas/ClockRequest'
        - type: object
          required: [employee_id, kind]
          properties:
            kind: {$ref: '#/components/schemas/TimeEntryKind'}

    PatchTimeEntryRequest:
      type: object
      required: [version]
      properties:
        occurred_at: {type: string, format: date-time}
        project_id: {type: string, nullable: true}
        activity_id: {type: string, nullable: true}
        location_id: {type: string, nullable: true}
        latitude: {type: number}
        longitude: {type: number}
        address: {type: string}
        client_type: {$ref: '#/components/schemas/TimeEntryClientType'}
        version: {type: integer, description: Optimistic concurrency token}

    CorrectTimeEntryRequest:
      allOf:
        - $ref: '#/components/schemas/ClockRequest'
        - type: object
          required: [kind]
          properties:
            kind: {$ref: '#/components/schemas/TimeEntryKind'}

    HourEntry:
