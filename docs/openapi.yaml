  /api/v1/organizations/{orgId}/payroll-runs:
    post:
      summary: Draft a payroll run
      description: |
        Creates a draft payroll run for a YYYY-MM period. The statutory rule
        pack version is pinned from the country code (my-2026-10 / id-2026-10).
        (organization_id, period) is unique: redrafting a period returns
        409 ALREADY_EXISTS. Requires manager role or higher (service accounts: the payroll:preview scope).
      operationId: createPayrollRun
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period, country_code]
              properties:
                period: { type: string, example: '2026-10', description: YYYY-MM }
                country_code: { type: string, enum: [MY, ID] }
      responses:
        '201':
          description: Draft run created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollRun' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/AlreadyExists' }
    get:
      summary: List payroll runs
      description: |
        Lists runs ordered by (created_at, id), paged. Filter by status and
        period. Requires manager role or higher (service accounts: the payroll:read scope). Members hold payroll:read for own-payslip self-service only.
      operationId: listPayrollRuns
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema: { type: string, enum: [draft, approved, locked, cancelled] }
        - name: period
          in: query
          schema: { type: string, example: '2026-10' }
      responses:
        '200':
          description: Paged runs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollRunList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/organizations/{orgId}/payroll-runs/{id}:
    get:
      summary: Get a payroll run
      description: Requires manager role or higher. Service accounts need the payroll:read scope. Members hold payroll:read for own-payslip self-service only.
      operationId: getPayrollRun
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollRun' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/organizations/{orgId}/payroll-runs/{id}/calculate:
    post:
      summary: Calculate pay lines for a draft run
      description: |
        Runs the statutory engine over the supplied employees and upserts one
        pay line per employee. Re-running is safe (optimistic concurrency on
        the stored lines). Approved unpaid leave overlapping the run month is
        auto-folded as an unpaid_leave_deduction (daily rate = base salary /
        26, a documented simplification), and staged sync items are folded in.
        Emits payroll.calculated. Requires manager role or higher (service accounts: the payroll:preview scope). Non-draft runs return 409 RUN_NOT_DRAFT.
      operationId: calculatePayrollRun
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalculatePayroll' }
      responses:
        '200':
          description: Calculated pay lines
          content:
            application/json:
              schema:
                type: object
                required: [run_id, lines]
                properties:
                  run_id: { type: string }
                  lines:
                    type: array
                    items: { $ref: '#/components/schemas/EmployeePayLine' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RunNotDraft' }

  /api/v1/organizations/{orgId}/payroll-runs/{id}/preview:
    post:
      summary: Dry-run preview with diff against the previous run
      description: |
        Same body as calculate, but nothing is persisted except the 30-minute
        preview payload that submit requires. Diffs every employee against the
        latest non-cancelled run of an earlier period (NO_PRIOR_RUN when
        there is none) with anomaly flags (NET_SWING_GT_20, NEW_EMPLOYEE,
        MISSING_BANK_DETAILS). No audit event: previews are read-only.
        Requires manager role or higher (service accounts: the payroll:preview scope).
      operationId: previewPayrollRun
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalculatePayroll' }
      responses:
        '200':
          description: Preview with diff and totals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollPreviewResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RunNotDraft' }

  /api/v1/organizations/{orgId}/payroll-runs/{id}/submit:
    post:
      summary: Submit a draft run (preview -> submit gate)
      description: |
        Moves draft -> approved. The gate mirrors the hris.submit_payroll MCP
        tool exactly: the run must be draft; preview_id must reference an
        existing, unexpired preview (30-minute TTL) that belongs to this run —
        missing/expired/foreign previews return 409 PREVIEW_REQUIRED /
        PREVIEW_STALE; then the version-checked transition runs. Emits
        payroll.submitted plus one payslip.issued per pay line. Requires admin role or higher (service accounts: the payroll:submit scope) — never bundled with the preview scope. Idempotent via Idempotency-Key.
      operationId: submitPayrollRun
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preview_id, version]
              properties:
                preview_id: { type: string }
                version: { type: integer, description: Run's current version (optimistic concurrency) }
      responses:
        '200':
          description: Run approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollRun' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PreviewRequired' }

  /api/v1/organizations/{orgId}/payroll-runs/{id}/lock:
    post:
      summary: Lock an approved run
      description: |
        Moves approved -> locked. Locked runs are immutable: calculate,
        sync-items, submit, and cancel are all rejected. Requires admin role or higher (service accounts: the payroll:submit scope).
      operationId: lockPayrollRun
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer }
      responses:
        '200':
          description: Run locked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollRun' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IllegalRunTransition' }

  /api/v1/organizations/{orgId}/payroll-runs/{id}/cancel:
    post:
      summary: Cancel a draft or approved run
      description: |
        Moves draft|approved -> cancelled. Requires the payroll:submit scope
        or admin role.
      operationId: cancelPayrollRun
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer }
      responses:
        '200':
          description: Run cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollRun' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IllegalRunTransition' }

  /api/v1/organizations/{orgId}/payroll-runs/{id}/sync-items:
    post:
      summary: Stage external payroll items on a draft run
      description: |
        Atomically appends externally-ingested items (attendance, claims)
        that the next calculate call folds into the pay lines. Draft runs
        only (409 RUN_NOT_DRAFT otherwise). Requires manager role or higher (service accounts: the payroll:preview scope).
      operationId: addPayrollSyncItems
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/SyncItemInput' }
      responses:
        '201':
          description: Items staged
          content:
            application/json:
              schema:
                type: object
                required: [run_id, added]
                properties:
                  run_id: { type: string }
                  added: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RunNotDraft' }

  /api/v1/organizations/{orgId}/payroll-runs/{id}/payslips/{employeeId}:
    get:
      summary: Get an employee's payslip
      description: |
        Returns the pay line as JSON, or as rendered HTML with ?format=html.
        Members may only read their own payslip; everyone else needs the
        payroll:read scope.
      operationId: getPayslip
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: employeeId
          in: path
          required: true
          schema: { type: string }
        - name: format
          in: query
          schema: { type: string, enum: [json, html], default: json }
      responses:
        '200':
          description: The payslip (JSON pay line, or text/html)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeePayLine' }
            text/html:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/organizations/{orgId}/payroll-runs/{id}/bank-file:
    get:
      summary: Generate the salary-credit bank file
      description: |
        Renders the bulk salary-credit file for an approved or locked run
        (409 RUN_NOT_APPROVED otherwise) as a text download. Every pay line is
        included — including employees with no bank account on file (empty
        account field; fix the record and regenerate) — with amounts in minor
        units. Maybank layout is a template: verify against the bank's current
        spec before use. Requires manager role or higher (service accounts: the payroll:read scope); members hold payroll:read for own-payslip self-service only and are rejected here.
      operationId: payrollBankFile
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: format
          in: query
          schema: { type: string, enum: [pipe, maybank], default: pipe }
      responses:
        '200':
          description: Bank file download
          content:
            text/plain:
              schema: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RunNotApproved' }

  /api/v1/organizations/{orgId}/payroll-runs/{id}/exports/epf-csv:
    get:
      summary: EPF contribution CSV (MY only)
      description: |
        Renders the EPF i-Akaun-style contribution CSV for an approved or
        locked MY run. The contribution-wage base is re-derived from the
        stored line items with the engine's rule (additions flagged
        SubjectToEPF minus deductions flagged ReducesContributionWages).
        VERIFY column order and amount format against KWSP's current upload
        spec before filing. Non-MY runs return 409 WRONG_COUNTRY. Requires
        manager role or higher (service accounts: the payroll:read scope); members hold payroll:read for own-payslip self-service only and are rejected here.
      operationId: payrollEPFExport
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: EPF CSV download
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/WrongCountry' }

  /api/v1/organizations/{orgId}/payroll-runs/{id}/exports/pcb-txt:
    get:
      summary: Monthly PCB data file (MY only)
      description: |
        Renders the LHDN e-Data PCB-style monthly tax file for an approved or
        locked MY run. Employees carry no tax-ID field: TaxIDNo is empty and
        the filer fills it from their own records. VERIFY the record layout
        against LHDN's current spec before filing. Non-MY runs return 409
        WRONG_COUNTRY. Requires manager role or higher (service accounts: the payroll:read scope); members hold
        payroll:read for own-payslip self-service only and are rejected here.
      operationId: payrollPCBExport
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: PCB txt download
          content:
            text/plain:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/WrongCountry' }

  /api/v1/organizations/{orgId}/payroll-runs/{id}/exports/borang-a:
    get:
      summary: Borang A summary (MY only)
      description: |
        Renders a plain-text Borang A (EPF Form A) summary — totals plus a
        per-employee breakdown — for an approved or locked MY run. Non-MY
        runs return 409 WRONG_COUNTRY. Requires manager role or higher (service accounts: the payroll:read scope); members hold payroll:read for own-payslip self-service only and are rejected here.
      operationId: payrollBorangAExport
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Borang A summary download
          content:
            text/plain:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/WrongCountry' }

  /api/v1/organizations/{orgId}/payroll-presets:
    post:
      summary: Create a payroll item preset
      description: |
        Creates an organization-level item preset. Codes must not collide with
        a seed code or another org preset (409 ALREADY_EXISTS). Requires admin role or higher (service accounts: the payroll:preview scope).
      operationId: createPayrollPreset
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePayrollPreset' }
      responses:
        '201':
          description: Preset created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollItemPreset' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/AlreadyExists' }
    get:
      summary: List payroll item presets
      description: |
        Returns the merged catalog: system seed presets (is_system, id
        "sys:<code>", immutable) first, then the organization's own presets,
        paged. Requires the payroll:preview scope or admin role.
      operationId: listPayrollPresets
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paged presets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollItemPresetList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/organizations/{orgId}/payroll-presets/{id}:
    patch:
      summary: Update a payroll item preset
      description: |
        Version-checked update of an organization preset. System presets are
        immutable (409 SYSTEM_PRESET_IMMUTABLE) — create an organization
        preset instead. Requires the payroll:preview scope or admin role.
      operationId: patchPayrollPreset
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: id
          in: path
          required: true
          description: Preset ID, or "sys:<code>" for seed presets
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchPayrollPreset' }
      responses:
        '200':
          description: Preset updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollItemPreset' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SystemPresetImmutable' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Personal access token or service-account token. Minted via the
        bootstrap (`POST /api/v1/organizations`) or
        `POST /api/v1/organizations/{orgId}/credentials`. The plaintext is
        shown once at issuance; present it as `Authorization: Bearer <token>`.
        A PAT authenticates only while its employee's status is `joined` —
        deactivating the employee immediately invalidates the token.

  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      description: Organization ID. Must match the caller's organization.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 100
        maximum: 1000
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's next_cursor.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Key for idempotent POSTs. Repeating a key with the same request
        replays the stored response; with a different request body it returns
        409 IDEMPOTENCY_KEY_REUSED.
      schema:
        type: string

  responses:
    Unauthenticated:
      description: Missing, invalid, expired, or revoked credential.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthenticated:
              value:
                code: UNAUTHENTICATED
                message: invalid, expired, or revoked credential
                request_id: abc123
    Forbidden:
      description: Authenticated but not permitted (role, scope, own-record, or cross-tenant violation).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              value:
                code: FORBIDDEN
                message: requires admin role or higher to update employees
                request_id: abc123
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              value:
                code: NOT_FOUND
                message: employee not found
                request_id: abc123
    ValidationError:
      description: Request failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validation:
              value:
                code: VALIDATION_ERROR
                message: "version: required and must be positive"
                details:
                  field: version
                request_id: abc123
    AlreadyExists:
      description: Unique constraint violated (e.g. organization slug).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            alreadyExists:
              value:
                code: ALREADY_EXISTS
                message: organization slug already taken
                request_id: abc123
    VersionConflict:
      description: Optimistic-concurrency conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            versionConflict:
              value:
                code: VERSION_CONFLICT
                message: resource changed since it was read; GET it again and retry
                request_id: abc123
    IdempotencyKeyReused:
      description: Idempotency key already used with a different request body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            reused:
              value:
                code: IDEMPOTENCY_KEY_REUSED
                message: idempotency key was already used with a different request
                request_id: abc123
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          description: Seconds until the window resets.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              value:
                code: RATE_LIMITED
                message: "rate limit exceeded: 100 requests/minute per credential"
                request_id: abc123

    BadRequest:
      description: Malformed JSON or a failed validation (VALIDATION_ERROR envelope).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            malformed:
              value:
                code: BAD_REQUEST
                message: 'invalid JSON: unexpected end of JSON input'
                request_id: abc123
            validation:
              value:
                code: VALIDATION_ERROR
                message: 'version: required and must be positive'
                request_id: abc123

    InsufficientBalance:
      description: Paid request exceeds the available balance.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            insufficient:
              value:
                code: INSUFFICIENT_BALANCE
                message: 'store: insufficient leave balance: need 5.00 days, have 3.00'
                request_id: abc123

    NotCurrentApprover:
      description: Caller is not the current pending approver (and not an admin).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notApprover:
              value:
                code: NOT_CURRENT_APPROVER
                message: 'store: not the current approver: current approver is <id>'
                request_id: abc123

    InvalidTransition:
      description: Status change not allowed from the current status.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid:
              value:
                code: INVALID_TRANSITION
                message: 'store: invalid status transition: cannot cancel a rejected request'
                request_id: abc123

    BulkApprovalFailed:
      description: Bulk approval failed for at least one request; nothing was applied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            bulkFailed:
              value:
                code: BULK_APPROVAL_FAILED
                message: 'bulk approval failed; nothing was applied'
                details:
                  results:
                    - request_id: req-1
                      approved: true
                    - request_id: req-2
                      approved: false
                      reason: not the current approver
                request_id: abc123

    NotEmpty:
      description: Resource still has dependents and cannot be deleted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notEmpty:
              value:
                code: GROUP_NOT_EMPTY
                message: policy still has leave requests
                request_id: abc123


    RunNotDraft:
      description: Run is not in draft status; pay lines and sync items can only change on draft runs.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notDraft:
              value:
                code: RUN_NOT_DRAFT
                message: 'store: payroll run not draft: payroll run <id> is locked'
                request_id: abc123

    IllegalRunTransition:
      description: The requested run status transition is not allowed (draft->approved/cancelled and approved->locked/cancelled are the only legal moves).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            illegal:
              value:
                code: ILLEGAL_TRANSITION
                message: 'state transition not allowed: store: illegal payroll run transition: locked -> cancelled'
                request_id: abc123

    SystemPresetImmutable:
      description: System (seed) payroll item presets cannot be updated; create an organization preset instead.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            immutable:
              value:
                code: SYSTEM_PRESET_IMMUTABLE
                message: system presets are immutable; create an organization preset instead
                request_id: abc123

    PreviewRequired:
      description: Submit requires a preview first (POST .../preview).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            required:
              value:
                code: PREVIEW_REQUIRED
                message: 'submit requires a preview: POST /payroll-runs/{id}/preview first'
                request_id: abc123

    PreviewStale:
      description: The preview is unknown, expired (30-minute TTL), or belongs to a different run.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            stale:
              value:
                code: PREVIEW_STALE
                message: 'preview not found or expired; generate a fresh preview'
                request_id: abc123

    RunNotApproved:
      description: Bank files and statutory exports require an approved or locked run.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notApproved:
              value:
                code: RUN_NOT_APPROVED
                message: run must be approved or locked before files can be generated
                request_id: abc123

    WrongCountry:
      description: The statutory export is only available for MY payroll runs.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            wrongCountry:
              value:
                code: WRONG_COUNTRY
                message: this export is only available for MY payroll runs
                request_id: abc123

  schemas:
    Error:
      title: Flat error envelope
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: Stable UPPER_SNAKE error code.
          example: NOT_FOUND
        message:
          type: string
          example: employee not found
        details:
          type: object
          description: Machine-readable extra context (e.g. the failing field).
          additionalProperties: true
        request_id:
          type: string
          description: Echo of the X-Request-ID response header for log correlation.
          example: abc123

    Role:
      type: string
      enum: [owner, admin, manager, member]

    ActorType:
      type: string
      enum: [human, agent, system, scim]

    CredentialKind:
      type: string
      enum: [pat, service_account]

    Scope:
      type: string
      enum:
        - time:read
        - time:write
        - leave:read
        - leave:write
        - leave:approve
        - payroll:read
        - payroll:preview
        - payroll:submit
        - employees:read
        - audit:read

    Organization:
      type: object
      required: [id, name, slug, country_code, created_at, updated_at, version]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        country_code:
          type: string
          example: ID
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int64

    OrganizationList:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        next_cursor:
          type: string
        has_more:
          type: boolean

    BootstrapRequest:
      type: object
      required: [name, slug, country_code, owner]
      properties:
        name:
          type: string
          example: Acme Corp
        slug:
          type: string
          example: acme
        country_code:
          type: string
          example: ID
        owner:
          type: object
          required: [first_name, last_name, email]
          properties:
            first_name:
              type: string
            last_name:
              type: string
            email:
              type: string
              format: email

    BootstrapResponse:
      type: object
      required: [organization, employee, credential, token]
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
        employee:
          $ref: '#/components/schemas/Employee'
        credential:
          $ref: '#/components/schemas/Credential'
        token:
          type: string
          description: Plaintext bearer token, shown exactly once.
          example: hris_...

    Group:
      type: object
      required: [id, organization_id, name, created_at, updated_at, version]
      properties:
        id:
          type: string
        organization_id:
          type: string
        name:
          type: string
        parent_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int64

    GroupList:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Group'
        next_cursor:
          type: string
        has_more:
          type: boolean

    Employee:
      type: object
      required: [id, organization_id, first_name, last_name, email, status, created_at, updated_at, version]
      properties:
        id:
          type: string
        organization_id:
          type: string
        employee_number:
          type: string
          description: Unique per organization. Generated as EMP-<8 hex> when omitted.
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        position:
          type: string
        employment_type:
          type: string
          enum: [full_time, part_time, contract, intern]
        group_id:
          type: string
          nullable: true
        manager_id:
          type: string
          nullable: true
        time_zone:
          type: string
          example: Asia/Jakarta
        work_start_date:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [not_invited, pending_invitation, joined, removed]
          description: Invitation status. PATs authenticate only while joined.
          example: joined
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int64

    CreateEmployeeRequest:
