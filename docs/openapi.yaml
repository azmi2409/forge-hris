          description: Event types to receive; "*" subscribes to all types
        active: {type: boolean}
        created_at: {type: string, format: date-time}

    WebhookSubscriptionRequest:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          description: Absolute http(s) URL receiving the POSTed envelopes
        secret:
          type: string
          description: |
            Signing secret. When omitted the server generates one and reveals
            it once in the response. Prefer a long random value of your own.
        events:
          type: array
          minItems: 1
          items: {type: string}
          example: ['employee.created', '*']
        active:
          type: boolean
          default: true

    WebhookSubscriptionPatch:
      type: object
      properties:
        url: {type: string, format: uri}
        secret:
          type: string
          description: Rotates the signing secret; the new value is echoed once
        events:
          type: array
          minItems: 1
          items: {type: string}
        active: {type: boolean}

    WebhookSubscriptionPage:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/WebhookSubscription'}
        next_cursor: {type: string}
        has_more: {type: boolean}

    WebhookEnvelope:
      type: object
      required: [id, type, time, data]
      properties:
        id:
          type: string
          description: |
            Unique message id. Delivery is at-least-once — consumers MUST
            dedupe on this value.
        type:
          type: string
          example: employee.created
          description: One of the event taxonomy strings
        time:
          type: string
          format: date-time
          description: Event time (enqueue time), stable across retries
        data:
          description: The event payload (the resource that changed)
    SCIMUser:
      type: object
      required: [schemas, id, userName, name, emails, active, meta]
      properties:
        schemas:
          type: array
          items: { type: string }
          example: ["urn:ietf:params:scim:schemas:core:2.0:User"]
        id: { type: string }
        userName:
          type: string
          description: The employee email (unique per organization).
        externalId:
          type: string
          description: IdP correlation key, from the scim_links table.
        name:
          type: object
          properties:
            givenName: { type: string }
            familyName: { type: string }
        emails:
          type: array
          items:
            type: object
            properties:
              value: { type: string }
              primary: { type: boolean }
              type: { type: string }
        active:
          type: boolean
          description: false = invitation status removed (soft-deactivated).
        meta:
          $ref: '#/components/schemas/SCIMMeta'
    SCIMUserRequest:
      type: object
      required: [userName]
      properties:
        schemas:
          type: array
          items: { type: string }
        userName: { type: string }
        externalId: { type: string }
        name:
          type: object
          properties:
            givenName: { type: string }
            familyName: { type: string }
        emails:
          type: array
          items:
            type: object
            properties:
              value: { type: string }
              primary: { type: boolean }
              type: { type: string }
        active:
          type: boolean
          default: true
          description: false = create then immediately deactivate.
    SCIMGroup:
      type: object
      required: [schemas, id, displayName, members, meta]
      properties:
        schemas:
          type: array
          items: { type: string }
          example: ["urn:ietf:params:scim:schemas:core:2.0:Group"]
        id: { type: string }
        displayName: { type: string }
        members:
          type: array
          items:
            type: object
            required: [value]
            properties:
              value: { type: string, description: Employee (SCIM user) ID. }
              $ref: { type: string }
              display: { type: string }
        meta:
          $ref: '#/components/schemas/SCIMMeta'
    SCIMGroupRequest:
      type: object
      required: [displayName]
      properties:
        schemas:
          type: array
          items: { type: string }
        displayName: { type: string }
        members:
          type: array
          items:
            type: object
            required: [value]
            properties:
              value: { type: string }
    SCIMPatchRequest:
      type: object
      properties:
        schemas:
          type: array
          items: { type: string }
          example: ["urn:ietf:params:scim:api:messages:2.0:PatchOp"]
        Operations:
          type: array
          items:
            type: object
            required: [op]
            properties:
              op:
                type: string
                enum: [add, remove, replace]
              path: { type: string }
              value: { description: Shape depends on path; see operation docs. }
    SCIMListResponse:
      type: object
      required: [schemas, totalResults, startIndex, itemsPerPage, Resources]
      properties:
        schemas:
          type: array
          items: { type: string }
          example: ["urn:ietf:params:scim:api:messages:2.0:ListResponse"]
        totalResults: { type: integer }
        startIndex: { type: integer }
        itemsPerPage: { type: integer }
        Resources:
          type: array
          items: { type: object }
    SCIMMeta:
      type: object
      properties:
        resourceType: { type: string, enum: [User, Group] }
        created: { type: string, format: date-time }
        lastModified: { type: string, format: date-time }
    SCIMError:
      type: object
      required: [schemas, status, detail]
      properties:
        schemas:
          type: array
          items: { type: string }
          example: ["urn:ietf:params:scim:api:messages:2.0:Error"]
        status:
          type: string
          description: HTTP status mirrored as a string, per RFC 7644.
        scimType:
          type: string
          description: e.g. invalidValue, invalidFilter, invalidPath, uniqueness, invalidSyntax.
        detail: { type: string }

    PayrollRun:
      type: object
      required: [id, organization_id, period, country_code, status, created_at, updated_at, version]
      properties:
        id: { type: string }
        organization_id: { type: string }
        period: { type: string, example: '2026-10' }
        country_code: { type: string, enum: [MY, ID] }
        status: { type: string, enum: [draft, approved, locked, cancelled] }
        rule_pack_version: { type: string, example: my-2026-10 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }
    PayrollRunList:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PayrollRun' }
        next_cursor: { type: string }
        has_more: { type: boolean }

    PayLineItem:
      type: object
      description: One computed payroll line item.
      properties:
        preset_code: { type: string }
        name: { type: string }
        kind: { type: string, enum: [addition, deduction, employer_contribution] }
        amount_minor: { type: integer, description: Minor units (sen / rupiah) }
        note: { type: string }
    StatutorySplits:
      type: object
      description: Computed statutory amounts; SOCSOEmployee includes the SKBBK employee share when applicable.
      properties:
        epf_employee: { type: integer }
        epf_employer: { type: integer }
        socso_employee: { type: integer }
        socso_employer: { type: integer }
        eis_employee: { type: integer }
        eis_employer: { type: integer }
        pcb: { type: integer }
        hrdf_employer: { type: integer }
        bpjs_kes_employer: { type: integer }
        bpjs_kes_employee: { type: integer }
        jht_employer: { type: integer }
        jht_employee: { type: integer }
        jkk_employer: { type: integer }
        jkm_employer: { type: integer }
        jp_employer: { type: integer }
        jp_employee: { type: integer }
        pph21: { type: integer }
    EmployeePayLine:
      type: object
      required: [id, organization_id, run_id, employee_id, gross_minor, additions_minor, deductions_minor, net_minor, statutory, created_at, updated_at, version]
      properties:
        id: { type: string }
        organization_id: { type: string }
        run_id: { type: string }
        employee_id: { type: string }
        gross_minor: { type: integer }
        additions_minor: { type: integer }
        deductions_minor: { type: integer }
        net_minor: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/PayLineItem' }
        statutory: { $ref: '#/components/schemas/StatutorySplits' }
        bank_account: { type: string }
        bank_code: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }

    CalculatePayroll:
      type: object
      required: [employees]
      properties:
        employees:
          type: array
          items:
            type: object
            required: [employee_id]
            properties:
              employee_id: { type: string }
              base_salary_minor: { type: integer }
              items:
                type: array
                items:
                  type: object
                  required: [preset_code]
                  properties:
                    preset_code: { type: string }
                    amount_minor: { type: integer }
              age_years: { type: integer }
              citizen_my: { type: boolean }
              foreign_worker_my: { type: boolean }
              pr_my: { type: boolean }
              skbbk_opt_in: { type: boolean }
              employer_borne_pcb: { type: boolean }
              jkk_risk_class: { type: integer, description: 1..5 (ID) }
              ptkp_status: { type: string, example: 'TK/0', description: ID }
              bank_account: { type: string }
              bank_code: { type: string }

    PreviewAnomaly:
      type: object
      properties:
        employee_id: { type: string }
        code:
          type: string
          enum: [NET_SWING_GT_20, NEW_EMPLOYEE, MISSING_BANK_DETAILS, NO_PRIOR_RUN]
        message: { type: string }
    EmployeePreview:
      type: object
      description: Per-employee diff between two runs.
      properties:
        employee_id: { type: string }
        prev_net_minor: { type: integer }
        new_net_minor: { type: integer }
        diff_minor: { type: integer }
        diff_pct: { type: number }
        anomalies:
          type: array
          items: { $ref: '#/components/schemas/PreviewAnomaly' }
    PayrollPreviewResponse:
      type: object
      required: [preview_id, expires_at, employees, totals]
      properties:
        preview_id: { type: string }
        expires_at: { type: string, format: date-time }
        employees:
          type: array
          items: { $ref: '#/components/schemas/EmployeePreview' }
        totals:
          type: object
          required: [employee_count, gross_minor, net_minor]
          properties:
            employee_count: { type: integer }
            gross_minor: { type: integer }
            net_minor: { type: integer }

    PayrollItemPreset:
      type: object
      required: [id, organization_id, code, name, kind, created_at, updated_at, version]
      properties:
        id: { type: string, description: '"sys:<code>" for seed presets' }
        organization_id: { type: string }
        code: { type: string }
        name: { type: string }
        kind: { type: string, enum: [addition, deduction, employer_contribution] }
        subject_to_epf: { type: boolean }
        subject_to_socso: { type: boolean }
        subject_to_eis: { type: boolean }
        subject_to_pcb: { type: boolean }
        subject_to_bpjs_kes: { type: boolean }
        subject_to_jht: { type: boolean }
        subject_to_jkk: { type: boolean }
        subject_to_jkm: { type: boolean }
        subject_to_jp: { type: boolean }
        subject_to_pph21: { type: boolean }
        reduces_contribution_wages: { type: boolean }
        is_system: { type: boolean, description: Seed preset; immutable }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }
    PayrollItemPresetList:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PayrollItemPreset' }
        next_cursor: { type: string }
        has_more: { type: boolean }
    CreatePayrollPreset:
      type: object
      required: [code, name, kind]
      properties:
        code: { type: string }
        name: { type: string }
        kind: { type: string, enum: [addition, deduction, employer_contribution] }
        subject_to_epf: { type: boolean }
        subject_to_socso: { type: boolean }
        subject_to_eis: { type: boolean }
        subject_to_pcb: { type: boolean }
        subject_to_bpjs_kes: { type: boolean }
        subject_to_jht: { type: boolean }
        subject_to_jkk: { type: boolean }
        subject_to_jkm: { type: boolean }
        subject_to_jp: { type: boolean }
        subject_to_pph21: { type: boolean }
        reduces_contribution_wages: { type: boolean }
    PatchPayrollPreset:
      type: object
      required: [version]
      properties:
        name: { type: string }
        kind: { type: string, enum: [addition, deduction, employer_contribution] }
        subject_to_epf: { type: boolean }
        subject_to_socso: { type: boolean }
        subject_to_eis: { type: boolean }
        subject_to_pcb: { type: boolean }
        subject_to_bpjs_kes: { type: boolean }
        subject_to_jht: { type: boolean }
        subject_to_jkk: { type: boolean }
        subject_to_jkm: { type: boolean }
        subject_to_jp: { type: boolean }
        subject_to_pph21: { type: boolean }
        reduces_contribution_wages: { type: boolean }
        version: { type: integer }

    SyncItemInput:
      type: object
      required: [employee_id, kind, preset_code]
      properties:
        employee_id: { type: string }
        source: { type: string }
        external_id: { type: string }
        label: { type: string }
        kind: { type: string, enum: [addition, deduction] }
        preset_code: { type: string }
        amount_minor: { type: integer }
