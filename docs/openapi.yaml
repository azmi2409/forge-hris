          description: Overtime breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OvertimePreviewResponse'

  /api/v1/organizations/{orgId}/leave-policies:
    post:
      summary: Create a time-off policy
      description: |
        Creates a leave policy with its accrual engine (annually, monthly,
        pay_period, payroll_hours), carry-forward cap, and expiry rule.
        Requires manager role or higher.
      operationId: createLeavePolicy
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, accrual_mode]
              properties:
                name: { type: string, example: Annual Leave }
                accrual_mode:
                  type: string
                  enum: [annually, monthly, pay_period, payroll_hours]
                accrual_amount:
                  type: number
                  description: Days granted per accrual period.
                  example: 1.25
                carry_forward_cap:
                  type: number
                  description: Max days carried into the next period; 0 disables.
                expiry_months:
                  type: integer
                  description: Months after period end when carried leave lapses; 0 never expires.
      responses:
        '201':
          description: Policy created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeOffPolicy' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      summary: List time-off policies
      operationId: listLeavePolicies
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated policies
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeOffPolicyList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/organizations/{orgId}/leave-policies/{policyId}:
    get:
      summary: Get a time-off policy
      operationId: getLeavePolicy
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: policyId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeOffPolicy' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update a time-off policy
      description: Optimistic concurrency — `version` must match the stored version.
      operationId: updateLeavePolicy
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: policyId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                name: { type: string }
                accrual_mode:
                  type: string
                  enum: [annually, monthly, pay_period, payroll_hours]
                accrual_amount: { type: number }
                carry_forward_cap: { type: number }
                expiry_months: { type: integer }
                version: { type: integer, description: Must match the stored version. }
      responses:
        '200':
          description: Policy updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeOffPolicy' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
    delete:
      summary: Delete a time-off policy
      description: Only when no requests or balances reference it (else 409 POLICY_NOT_EMPTY).
      operationId: deleteLeavePolicy
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: policyId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Policy deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NotEmpty' }

  /api/v1/organizations/{orgId}/leave-balances:
    get:
      summary: List leave balances
      description: Filter by employee_id, policy_id, period (YYYY).
      operationId: listLeaveBalances
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: employee_id
          in: query
          schema: { type: string }
        - name: policy_id
          in: query
          schema: { type: string }
        - name: period
          in: query
          description: Annual period label, e.g. 2026.
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated balances
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveBalanceList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/organizations/{orgId}/leave-balances/recalculate:
    post:
      summary: Recalculate a leave balance
      description: |
        Recomputes the employee's balance for as_of's year from the policy,
        tenure, and paid requested/approved requests (working days via the
        optional holiday calendar), applies carry-forward from the stored
        previous-period balance and expiry, then upserts the result.
        Idempotent: same inputs, same stored balance. Members may only
        recalculate their own balance.
      operationId: recalculateLeaveBalance
      parameters:
        - $ref: '#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employee_id, policy_id]
              properties:
                employee_id: { type: string }
                policy_id: { type: string }
                as_of:
                  type: string
                  format: date-time
                  description: Defaults to now.
                holiday_calendar_id:
                  type: string
                  description: Holidays excluded from working-day counts.
      responses:
        '200':
          description: Recalculated balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveBalance' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/organizations/{orgId}/leave-requests:
    post:
      summary: Create a leave request
      description: |
        Creates a request with status `requested`. `days` is computed
        server-side from dates and holidays. Paid requests check the
        recalculated balance (409 INSUFFICIENT_BALANCE when short); unpaid
        requests skip the check (component 5 deducts them from pay instead).
        The approval chain defaults to the employee's manager; an explicit
        `approver_ids` chain requires manager role or higher. A snapshot of
        the policy rules and the balance at request time is frozen onto the
        request. Members may only request for themselves.
      operationId: createLeaveRequest
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employee_id, policy_id, start_date, end_date]
              properties:
                employee_id: { type: string }
                policy_id: { type: string }
                start_date: { type: string, format: date, example: '2026-12-24' }
                end_date: { type: string, format: date, example: '2026-12-31' }
                is_unpaid: { type: boolean, default: false }
                holiday_calendar_id: { type: string }
                approver_ids:
                  type: array
                  items: { type: string }
                  description: Ordered approver chain; overrides the manager default.
      responses:
        '201':
          description: Request created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeOffRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InsufficientBalance' }
    get:
      summary: List leave requests
      description: Filter by employee_id, policy_id, status.
      operationId: listLeaveRequests
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: employee_id
          in: query
          schema: { type: string }
        - name: policy_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [requested, approved, rejected, cancelled]
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated requests
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeOffRequestList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/organizations/{orgId}/leave-requests/bulk-approve:
    post:
      summary: Bulk-approve leave requests (two-phase)
      description: |
        Two-phase: `{ids, preview: true}` returns per-request approvability
        without mutating; `{ids, preview: false}` approves every listed
        request or none (all-or-nothing; 409 BULK_APPROVAL_FAILED with
        per-request reasons when any request fails). The confirm accepts
        Idempotency-Key and is idempotent. Requires the leave:approve scope;
        each request must be decidable by the caller (current chain approver
        or admin).
      operationId: bulkApproveLeaveRequests
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: string }
                preview: { type: boolean, default: false }
      responses:
        '200':
          description: Preview results, or the approved requests on confirm
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BulkApprovePreview'
                  - $ref: '#/components/schemas/BulkApproveResult'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/BulkApprovalFailed' }

  /api/v1/organizations/{orgId}/leave-requests/{id}:
    get:
      summary: Get a leave request
      operationId: getLeaveRequest
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeOffRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update a leave request
      description: Only `requested` requests can be edited (409 INVALID_TRANSITION otherwise). `version` must match.
      operationId: updateLeaveRequest
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                start_date: { type: string, format: date }
                end_date: { type: string, format: date }
                is_unpaid: { type: boolean }
                holiday_calendar_id: { type: string }
                version: { type: integer }
      responses:
        '200':
          description: Request updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeOffRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }

  /api/v1/organizations/{orgId}/leave-requests/{id}/cancel:
    post:
      summary: Cancel a leave request
      description: Allowed from `requested` or `approved`. Members may only cancel their own.
      operationId: cancelLeaveRequest
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer }
      responses:
        '200':
          description: Request cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeOffRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }

  /api/v1/organizations/{orgId}/leave-requests/{id}/approve:
    post:
      summary: Approve a leave request (chain-aware)
      description: |
        Requires the leave:approve scope AND being the current pending
        approver (or admin). Approving advances the chain; when no pending
        steps remain the request becomes `approved`.
      operationId: approveLeaveRequest
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, description: Request version for optimistic concurrency. }
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalDecision' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NotCurrentApprover' }

  /api/v1/organizations/{orgId}/leave-requests/{id}/reject:
    post:
      summary: Reject a leave request (chain-aware)
      description: |
        Requires the leave:approve scope AND being the current pending
        approver (or admin). Any rejection makes the request `rejected`
        (short-circuits the chain).
      operationId: rejectLeaveRequest
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer }
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalDecision' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NotCurrentApprover' }

  /api/v1/organizations/{orgId}/leave-requests/{id}/approvals:
    get:
      summary: List a request's approval chain
      description: Steps ordered by sequence; the current step is the lowest-sequence pending one.
      operationId: listLeaveApprovals
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated approval steps
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeOffApprovalList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Append an approval step
      description: Requires manager role or higher. Only on `requested` requests.
      operationId: addLeaveApproval
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approver_employee_id]
              properties:
                approver_employee_id: { type: string }
                sequence:
                  type: integer
                  description: 1-based; omitted auto-assigns max+1.
      responses:
        '201':
          description: Step created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeOffApproval' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }

  /api/v1/organizations/{orgId}/holiday-calendars:
    post:
      summary: Create a holiday calendar
      operationId: createHolidayCalendar
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, country_code]
              properties:
                name: { type: string, example: Malaysia Public Holidays }
                country_code: { type: string, enum: [MY, ID] }
      responses:
        '201':
          description: Calendar created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HolidayCalendar' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      summary: List holiday calendars
      operationId: listHolidayCalendars
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated calendars
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HolidayCalendarList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/organizations/{orgId}/holiday-calendars/{calendarID}:
    get:
      summary: Get a holiday calendar
      operationId: getHolidayCalendar
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: calendarID
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The calendar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HolidayCalendar' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update a holiday calendar
      operationId: updateHolidayCalendar
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: calendarID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                name: { type: string }
                country_code: { type: string, enum: [MY, ID] }
                version: { type: integer }
      responses:
        '200':
          description: Calendar updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HolidayCalendar' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
    delete:
      summary: Delete a holiday calendar
      description: Only when it has no holidays (else 409 CALENDAR_NOT_EMPTY).
      operationId: deleteHolidayCalendar
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: calendarID
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Calendar deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NotEmpty' }

  /api/v1/organizations/{orgId}/holiday-calendars/{calendarID}/holidays:
    post:
      summary: Add a holiday
      description: (calendar_id, date) must be unique.
      operationId: createHoliday
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: calendarID
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, name]
              properties:
                date: { type: string, format: date, example: '2026-01-01' }
                name: { type: string, example: New Year's Day }
      responses:
        '201':
          description: Holiday created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Holiday' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AlreadyExists' }
    get:
      summary: List holidays
      description: Ordered by date.
      operationId: listHolidays
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: calendarID
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated holidays
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HolidayList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/organizations/{orgId}/holiday-calendars/{calendarID}/holidays/{holidayID}:
    delete:
      summary: Delete a holiday
      operationId: deleteHoliday
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: calendarID
          in: path
          required: true
          schema: { type: string }
        - name: holidayID
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Holiday deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/organizations/{orgId}/who-is-on-leave:
    get:
      summary: Who is on leave
      description: Approved leave requests (paid and unpaid) overlapping the date.
      operationId: whoIsOnLeave
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: date
          in: query
          description: YYYY-MM-DD; defaults to today (UTC).
          schema: { type: string, format: date }
      responses:
        '200':
          description: People on leave
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WhoIsOnLeave' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/v1/organizations/{orgId}/webhooks:
    post:
      summary: Create a webhook subscription
      description: |
        Registers an outbound webhook for the organization. The signing
        secret is generated when omitted and is revealed exactly once in
        this response — it cannot be retrieved again (rotate via PATCH).
        Events fan out only to active subscriptions whose `events` include
        the event type or `*`.
      operationId: createWebhookSubscription
      parameters:
        - $ref: '#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionRequest'
      responses:
        '201':
          description: Subscription created; secret shown once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      summary: List webhook subscriptions
      description: |
        Cursor-paginated subscriptions for the organization, ordered by
        (created_at, id). Secrets are never included.
      operationId: listWebhookSubscriptions
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Subscription page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptionPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/organizations/{orgId}/webhooks/{webhookId}:
    get:
      summary: Get a webhook subscription
      description: The secret is never included in the response.
      operationId: getWebhookSubscription
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: webhookId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update a webhook subscription
      description: |
        Applies the provided fields; omitted fields are unchanged. Passing a
        new `secret` rotates it and echoes the new value once in the
        response. Set `active: false` to pause deliveries without deleting
        the subscription (pending messages resume on reactivation).
      operationId: updateWebhookSubscription
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: webhookId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionPatch'
      responses:
        '200':
          description: Updated subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a webhook subscription
      description: |
        Removes the subscription. Pending outbox messages for it are
        dropped; sent/dead history goes with it.
      operationId: deleteWebhookSubscription
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: webhookId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/organizations/{orgId}/webhooks/{webhookId}/test:
    post:
      summary: Send a test webhook
      description: |
        The Jibble-style TestWebhook: enqueues a `webhook.test` event for
        exactly this subscription (bypassing its event filter) through the
        normal outbox → dispatcher pipeline. The response carries the
        outbox message id for correlation. 400 when the subscription is
        inactive.
      operationId: testWebhookSubscription
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: webhookId
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Test event enqueued
          content:
            application/json:
              schema:
                type: object
                required: [message_id]
                properties:
                  message_id:
                    type: string
                    description: Outbox message id; matches the delivered envelope's id
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /scim/v2/Users:
    get:
      summary: List users
      description: |
        SCIM ListResponse of provisioned users (employees). Supports
        `filter=userName eq "a@b.c"`, `filter=externalId eq "..."`,
        `startIndex`, and `count`. Requires a service account with the
        employees:read scope.
      operationId: scimListUsers
      security:
        - bearerAuth: []
      parameters:
        - name: filter
          in: query
          schema: { type: string }
          description: 'Minimal eq dialect: userName eq "..." or externalId eq "..."'
        - name: startIndex
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: count
          in: query
          schema: { type: integer, minimum: 0, maximum: 1000, default: 100 }
      responses:
        '200':
          description: SCIM ListResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMListResponse'
        '400':
          description: Bad filter or pagination (SCIM error body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMError'
        '401':
          description: Not a service-account credential (SCIM error body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMError'
        '403':
          description: Missing employees:read scope (SCIM error body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMError'
    post:
      summary: Provision a user
      description: |
        Creates an employee from a SCIM User. userName (an email) and
        name.givenName are required; externalId is linked in scim_links.
        active:false creates the employee then immediately deactivates it.
        Requires the employees:write scope. 409 scimType
        `uniqueness` on duplicate email or externalId.
      operationId: scimCreateUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SCIMUserRequest'
      responses:
        '201':
          description: Created SCIM User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMUser'
        '400':
          description: Validation failure (SCIM error body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMError'
        '401':
          description: Not a service-account credential (SCIM error body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMError'
        '403':
          description: Missing employees:write scope (SCIM error body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMError'
        '409':
          description: Duplicate email or externalId (SCIM error body, scimType uniqueness)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMError'

  /scim/v2/Users/{id}:
    get:
      summary: Get a user
      operationId: scimGetUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: SCIM User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMUser'
        '401':
          description: Not a service-account credential (SCIM error body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMError'
        '403':
          description: Missing employees:read scope (SCIM error body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMError'
        '404':
          description: Unknown user (SCIM error body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMError'
    put:
      summary: Replace a user
      description: |
        Full replacement of mutable fields (userName/email, name,
        externalId, active). An absent externalId drops the link; an absent
        active flag keeps the current status. active:false deactivates via
        the soft-deactivate path. Requires the employees:write scope.
      operationId: scimReplaceUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SCIMUserRequest'
      responses:
        '200':
          description: Replaced SCIM User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMUser'
        '400':
          description: Validation failure (SCIM error body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMError'
        '401':
          description: Not a service-account credential (SCIM error body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMError'
        '403':
          description: Missing employees:write scope (SCIM error body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMError'
        '404':
          description: Unknown user (SCIM error body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMError'
        '409':
          description: Duplicate email or externalId (SCIM error body, scimType uniqueness)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMError'
    patch:
      summary: Patch a user
      description: |
        RFC 7644 PATCH. Ops replace/add supported on paths active,
        name.givenName, name.familyName, emails, externalId; op remove only
        on externalId (unlinks). Requires the employees:write scope.
      operationId: scimPatchUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SCIMPatchRequest'
      responses:
        '200':
          description: Patched SCIM User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMUser'
        '400':
          description: Bad op/path/value (SCIM error body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMError'
        '401':
          description: Not a service-account credential (SCIM error body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMError'
        '403':
          description: Missing employees:write scope (SCIM error body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMError'
        '404':
          description: Unknown user (SCIM error body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMError'
    delete:
      summary: Deprovision a user
      description: |
        Soft-deactivate: sets invitation status to removed (active=false
        semantics). The record and its externalId link are kept; the IdP can
        re-correlate on re-provisioning. Idempotent: 204 even if already
        removed. Requires the employees:write scope.
      operationId: scimDeleteUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Deactivated
        '401':
          description: Not a service-account credential (SCIM error body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMError'
        '403':
          description: Missing employees:write scope (SCIM error body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMError'
        '404':
          description: Unknown user (SCIM error body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMError'

