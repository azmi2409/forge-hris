  /api/v1/organizations/{orgId}/pay-periods:
    get:
      summary: List pay periods
      operationId: listPayPeriods
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: definition_id
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/PayPeriodStatus'}
      responses:
        '200':
          description: Paginated pay periods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayPeriodPage'
    post:
      summary: Generate a pay period
      description: |
        Manager+ only. Computes the [start, end) range from the definition's
        cadence around period_start (defaults to now). The unique
        (definition_id, period_start) makes regeneration idempotent-ish:
        duplicates return 409 ALREADY_EXISTS.
      operationId: createPayPeriod
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [definition_id]
              properties:
                definition_id:
                  type: string
                period_start:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Pay period created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayPeriod'

  /api/v1/organizations/{orgId}/pay-periods/{periodId}:
    get:
