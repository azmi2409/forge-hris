# OpenAPI 3.1 fragment — forge-hris component 2 (time tracking).
#
# MERGE NOTES FOR WORKER C (do not ship this file standalone):
# 1. Append every entry under `paths:` into the main openapi.yaml `paths:`
#    (the main file uses `{orgId}` in path templates — kept here too).
# 2. Append every entry under `components.schemas:` into the main
#    `components.schemas:`. The `Error`, `OrgId`, `Limit`, `Cursor`,
#    `IdempotencyKey` refs already exist in the main file — do not duplicate.
# 3. New error codes introduced: ALREADY_CLOCKED_IN (409), PERIOD_LOCKED
#    (409), INVALID_TRANSITION (409). They are documented inline on the
#    operations; add them to any central error-code table if one exists.
# 4. Bump the main info.version / title to mention component 2.
#
# RBAC summary (mirrors api/time.go):
# - Reads need scope time:read; writes need time:write.
# - Members are self-scoped on entries/hour-entries/schedules/shifts.
# - POST /time-entries (manual backfill), projects, pay-period definitions,
#   schedules, shifts: manager+.
# - Pay-period submit/approve/reject: manager+; reopen: admin+.
# - clock-in/out, breaks/start, breaks/end REQUIRE an Idempotency-Key
#   header (400 without it; replays handled by the idempotency middleware).
#
# Note on mapError: the component 2 sentinels are mapped in api/time.go
# (mapTimeError), NOT in the shared mapError in api/server.go — if a central
# error-code list is maintained, mirror the three codes there.

paths:
  /api/v1/organizations/{orgId}/clock-in:
    post:
      summary: Clock in
      description: |
        Creates an `in` time entry for the employee. Exactly one open entry
        may exist per employee: clocking in twice returns 409
        ALREADY_CLOCKED_IN. Requires an Idempotency-Key header.
      operationId: clockIn
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClockRequest'
      responses:
        '201':
          description: Clocked in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Already clocked in, or the entry falls in a frozen pay period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/organizations/{orgId}/clock-out:
    post:
      summary: Clock out
      description: |
        Creates an `out` time entry closing the employee's open entry.
        404 when no entry is open. Requires an Idempotency-Key header.
      operationId: clockOut
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClockRequest'
      responses:
        '201':
          description: Clocked out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'

  /api/v1/organizations/{orgId}/breaks/start:
    post:
      summary: Start a break
      description: |
        Creates a `start_break` entry. Requires a working open entry
        (kind `in` or `end_break`); otherwise 409 INVALID_TRANSITION.
        Requires an Idempotency-Key header.
      operationId: startBreak
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClockRequest'
      responses:
        '201':
          description: Break started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'

  /api/v1/organizations/{orgId}/breaks/end:
    post:
      summary: End a break
      description: |
        Creates an `end_break` entry. Requires an open `start_break`;
        otherwise 409 INVALID_TRANSITION. Requires an Idempotency-Key header.
      operationId: endBreak
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClockRequest'
      responses:
        '201':
          description: Break ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'

  /api/v1/organizations/{orgId}/time-entries:
    get:
      summary: List time entries
      description: |
        Cursor-paginated. Shows head entries only (superseded rows excluded)
        unless `include_history=true`; soft-deleted rows excluded unless
        `include_deleted=true`. Members are restricted to their own entries.
      operationId: listTimeEntries
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: employee_id
          in: query
          schema: {type: string}
        - name: kind
          in: query
          schema: {$ref: '#/components/schemas/TimeEntryKind'}
        - name: from
          in: query
          description: RFC3339 lower bound on occurred_at
          schema: {type: string, format: date-time}
        - name: to
          in: query
          description: RFC3339 exclusive upper bound on occurred_at
          schema: {type: string, format: date-time}
        - name: include_deleted
          in: query
          schema: {type: boolean, default: false}
        - name: include_history
          in: query
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Paginated time entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntryPage'
    post:
      summary: Create a manual time entry (backfill)
      description: |
        Stores a punch without enforcing the clock state machine.
        Manager+ only; members punch through the clock endpoints.
      operationId: createTimeEntry
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTimeEntryRequest'
      responses:
        '201':
          description: Entry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'

  /api/v1/organizations/{orgId}/time-entries/{entryId}:
    get:
      summary: Get a time entry
      operationId: getTimeEntry
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: entryId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: The entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'
    patch:
      summary: Patch a time entry
      description: |
        Sparse update (occurred_at, project/activity/location, GPS, address,
        client_type). Only when the entry is mutable: not locked and not
        inside a submitted/approved pay period, otherwise 409 PERIOD_LOCKED.
        Kind changes go through /correct.
      operationId: patchTimeEntry
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: entryId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchTimeEntryRequest'
      responses:
        '200':
          description: Entry updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'

  /api/v1/organizations/{orgId}/time-entries/{entryId}/correct:
    post:
      summary: Correct a time entry
      description: |
        Corrections, never edits: freezes the original entry (is_locked,
        linked forward via next_id) and creates a superseding head entry
        linked back via prev_id. The original must be a head entry and
        mutable, otherwise 409 INVALID_TRANSITION / PERIOD_LOCKED.
      operationId: correctTimeEntry
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: entryId
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectTimeEntryRequest'
      responses:
        '201':
          description: Superseding entry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'

  /api/v1/organizations/{orgId}/hour-entries:
    get:
      summary: List hour entries
      description: Manual hour logs. Members see only their own.
      operationId: listHourEntries
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: employee_id
          in: query
          schema: {type: string}
        - name: from
          in: query
          description: YYYY-MM-DD lower bound on work_date
          schema: {type: string}
        - name: to
          in: query
          description: YYYY-MM-DD exclusive upper bound on work_date
          schema: {type: string}
        - name: include_deleted
          in: query
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Paginated hour entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HourEntryPage'
    post:
      summary: Create an hour entry
      operationId: createHourEntry
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HourEntryRequest'
      responses:
        '201':
          description: Hour entry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HourEntry'

  /api/v1/organizations/{orgId}/hour-entries/{entryId}:
    get:
      summary: Get an hour entry
      operationId: getHourEntry
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: entryId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: The hour entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HourEntry'
    patch:
      summary: Patch an hour entry
      description: Version-checked. 409 PERIOD_LOCKED inside a frozen pay period.
      operationId: patchHourEntry
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: entryId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HourEntryRequest'
      responses:
        '200':
          description: Hour entry updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HourEntry'
    delete:
      summary: Delete an hour entry (soft)
      description: Version-checked soft delete.
      operationId: deleteHourEntry
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: entryId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: integer
                  description: Optimistic concurrency token
      responses:
        '204':
          description: Deleted

  /api/v1/organizations/{orgId}/projects:
    get:
      summary: List projects
      operationId: listProjects
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
    post:
      summary: Create a project
      description: Manager+ only.
      operationId: createProject
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'

  /api/v1/organizations/{orgId}/projects/{projectId}:
    get:
      summary: Get a project
      operationId: getProject
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: projectId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: The project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
    patch:
      summary: Patch a project
      description: Manager+ only. Version-checked.
      operationId: patchProject
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: projectId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
    delete:
      summary: Delete a project
      description: |
        Manager+ only. Hard delete; referencing time/hour entries keep
        their rows with project_id set to NULL.
      operationId: deleteProject
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: projectId
          in: path
          required: true
          schema: {type: string}
      responses:
        '204':
          description: Deleted

  /api/v1/organizations/{orgId}/pay-period-definitions:
    get:
      summary: List pay-period definitions
      operationId: listPayPeriodDefinitions
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayPeriodDefinitionPage'
    post:
      summary: Create a pay-period definition
      description: Manager+ only.
      operationId: createPayPeriodDefinition
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayPeriodDefinitionRequest'
      responses:
        '201':
          description: Definition created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayPeriodDefinition'

  /api/v1/organizations/{orgId}/pay-period-definitions/{definitionId}:
    get:
      summary: Get a pay-period definition
      operationId: getPayPeriodDefinition
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: definitionId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: The definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayPeriodDefinition'
    patch:
      summary: Patch a pay-period definition
      description: Manager+ only. Version-checked.
      operationId: patchPayPeriodDefinition
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: definitionId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayPeriodDefinitionRequest'
      responses:
        '200':
          description: Definition updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayPeriodDefinition'
    delete:
      summary: Delete a pay-period definition
      description: Manager+ only. 409 when pay periods still reference it.
      operationId: deletePayPeriodDefinition
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: definitionId
          in: path
          required: true
          schema: {type: string}
      responses:
        '204':
          description: Deleted

  /api/v1/organizations/{orgId}/pay-periods:
    get:
      summary: List pay periods
      operationId: listPayPeriods
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: definition_id
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/PayPeriodStatus'}
      responses:
        '200':
          description: Paginated pay periods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayPeriodPage'
    post:
      summary: Generate a pay period
      description: |
        Manager+ only. Computes the [start, end) range from the definition's
        cadence around period_start (defaults to now). The unique
        (definition_id, period_start) makes regeneration idempotent-ish:
        duplicates return 409 ALREADY_EXISTS.
      operationId: createPayPeriod
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [definition_id]
              properties:
                definition_id:
                  type: string
                period_start:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Pay period created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayPeriod'

  /api/v1/organizations/{orgId}/pay-periods/{periodId}:
    get:
      summary: Get a pay period
      operationId: getPayPeriod
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: periodId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: The pay period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayPeriod'

  /api/v1/organizations/{orgId}/pay-periods/{periodId}/submit:
    post:
      summary: Submit a pay period
      description: |
        Manager+ only. Open/Reopened/Rejected -> Submitted. Freezes the
        period's entries (409 PERIOD_LOCKED on writes) while awaiting a
        decision.
      operationId: submitPayPeriod
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: periodId
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          description: Period submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayPeriod'

  /api/v1/organizations/{orgId}/pay-periods/{periodId}/approve:
    post:
      summary: Approve a pay period
      description: |
        Manager+ only. Submitted -> Approved. Locks every entry the period
        covers (is_locked); reopening unlocks them.
      operationId: approvePayPeriod
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: periodId
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          description: Period approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayPeriod'

  /api/v1/organizations/{orgId}/pay-periods/{periodId}/reject:
    post:
      summary: Reject a pay period
      description: Manager+ only. Submitted -> Rejected (may be resubmitted).
      operationId: rejectPayPeriod
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: periodId
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          description: Period rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayPeriod'

  /api/v1/organizations/{orgId}/pay-periods/{periodId}/reopen:
    post:
      summary: Reopen a pay period
      description: Admin+ only. Approved -> Reopened. Unlocks covered entries.
      operationId: reopenPayPeriod
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: periodId
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          description: Period reopened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayPeriod'

  /api/v1/organizations/{orgId}/schedules:
    get:
      summary: List schedules
      description: Members see only their own schedules.
      operationId: listSchedules
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: employee_id
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Paginated schedules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulePage'
    post:
