      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleRequest'
      responses:
        '201':
          description: Schedule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'

  /api/v1/organizations/{orgId}/schedules/{scheduleId}:
    get:
      summary: Get a schedule
      operationId: getSchedule
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: scheduleId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: The schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
    patch:
      summary: Patch a schedule
      description: Manager+ only. Version-checked.
      operationId: patchSchedule
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: scheduleId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleRequest'
      responses:
        '200':
          description: Schedule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
    delete:
      summary: Delete a schedule
      description: Manager+ only.
      operationId: deleteSchedule
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: scheduleId
          in: path
          required: true
          schema: {type: string}
      responses:
        '204':
          description: Deleted

  /api/v1/organizations/{orgId}/shifts:
    get:
      summary: List shifts
      description: Members see only their own shifts.
      operationId: listShifts
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: employee_id
          in: query
          schema: {type: string}
        - name: from
          in: query
          description: YYYY-MM-DD lower bound on shift_date
          schema: {type: string}
        - name: to
          in: query
          description: YYYY-MM-DD exclusive upper bound on shift_date
          schema: {type: string}
        - name: published
          in: query
          schema: {type: boolean}
      responses:
        '200':
          description: Paginated shifts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftPage'
    post:
      summary: Create a shift
      description: Manager+ only.
      operationId: createShift
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftRequest'
      responses:
        '201':
          description: Shift created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'

  /api/v1/organizations/{orgId}/shifts/publish:
    post:
      summary: Bulk-publish shifts
      description: |
        Manager+ only. Marks draft shifts published (visible to employees).
        Idempotent: already-published shifts are skipped. Returns the count
        newly published.
      operationId: publishShifts
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: {type: string}
      responses:
        '200':
          description: Publish count
          content:
            application/json:
              schema:
                type: object
                required: [published]
                properties:
                  published:
                    type: integer
                    example: 3

  /api/v1/organizations/{orgId}/shifts/{shiftId}:
    get:
      summary: Get a shift
      operationId: getShift
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: shiftId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: The shift
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'
    patch:
      summary: Patch a shift
      description: Manager+ only. Version-checked.
      operationId: patchShift
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: shiftId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftRequest'
      responses:
        '200':
          description: Shift updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'
    delete:
      summary: Delete a shift
      description: Manager+ only.
      operationId: deleteShift
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: shiftId
          in: path
          required: true
          schema: {type: string}
      responses:
        '204':
          description: Deleted

  /api/v1/organizations/{orgId}/overtime/preview:
    post:
      summary: Preview overtime for a date range
      description: |
        Read-only: lists the employee's time entries over [from, to) and
        runs the pure overtime engine. Members may only preview their own
        hours. No audit event, no idempotency key needed.
      operationId: previewOvertime
      parameters:
        - $ref: '#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OvertimePreviewRequest'
      responses:
        '200':
          description: Overtime breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OvertimePreviewResponse'

components:
  responses:
    BadRequest:
      description: Malformed JSON or a failed validation (VALIDATION_ERROR envelope).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      # MERGE NOTE: the main openapi.yaml has no BadRequest response yet —
      # copy this entry into its components.responses.

  schemas:
    TimeEntryKind:
      type: string
      enum: [in, out, start_break, end_break]

    TimeEntryClientType:
      type: string
      enum: [web, mobile, desktop, kiosk, ai_assistant]

    TimeEntry:
      type: object
      required: [id, organization_id, employee_id, kind, occurred_at, client_type, is_locked, version, created_at, updated_at]
      properties:
        id: {type: string}
        organization_id: {type: string}
        employee_id: {type: string}
        kind: {$ref: '#/components/schemas/TimeEntryKind'}
        occurred_at: {type: string, format: date-time}
        project_id: {type: string, nullable: true}
        activity_id: {type: string, nullable: true, description: Forward reference; activities land in a later component}
        location_id: {type: string, nullable: true, description: Forward reference; locations land in a later component}
        latitude: {type: number, nullable: true}
        longitude: {type: number, nullable: true}
        address: {type: string, nullable: true}
        client_type: {$ref: '#/components/schemas/TimeEntryClientType'}
        prev_id: {type: string, nullable: true, description: Correction chain backlink}
        next_id: {type: string, nullable: true, description: Set when superseded by a correction}
        is_locked: {type: boolean, description: Frozen by correction or pay-period approval}
        version: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        deleted_at: {type: string, format: date-time, nullable: true}

    TimeEntryPage:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/TimeEntry'}
        next_cursor: {type: string}
        has_more: {type: boolean}

    ClockRequest:
      type: object
      properties:
        employee_id:
          type: string
          description: Defaults to the caller's employee; members may only name themselves
        occurred_at:
          type: string
          format: date-time
          description: Defaults to now
        project_id: {type: string}
        activity_id: {type: string}
        location_id: {type: string}
        latitude: {type: number}
        longitude: {type: number}
        address: {type: string}
        client_type:
          $ref: '#/components/schemas/TimeEntryClientType'
          default: web

    CreateTimeEntryRequest:
      allOf:
        - $ref: '#/components/schemas/ClockRequest'
        - type: object
          required: [employee_id, kind]
          properties:
            kind: {$ref: '#/components/schemas/TimeEntryKind'}

    PatchTimeEntryRequest:
      type: object
      required: [version]
      properties:
        occurred_at: {type: string, format: date-time}
        project_id: {type: string, nullable: true}
        activity_id: {type: string, nullable: true}
        location_id: {type: string, nullable: true}
        latitude: {type: number}
        longitude: {type: number}
        address: {type: string}
        client_type: {$ref: '#/components/schemas/TimeEntryClientType'}
        version: {type: integer, description: Optimistic concurrency token}

    CorrectTimeEntryRequest:
      allOf:
        - $ref: '#/components/schemas/ClockRequest'
        - type: object
          required: [kind]
          properties:
            kind: {$ref: '#/components/schemas/TimeEntryKind'}

    HourEntry:
      type: object
      required: [id, organization_id, employee_id, work_date, hours, version, created_at, updated_at]
      properties:
        id: {type: string}
        organization_id: {type: string}
        employee_id: {type: string}
        work_date: {type: string, format: date, example: '2026-10-12'}
        hours: {type: number}
        project_id: {type: string, nullable: true}
        note: {type: string}
        version: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        deleted_at: {type: string, format: date-time, nullable: true}

    HourEntryPage:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/HourEntry'}
        next_cursor: {type: string}
        has_more: {type: boolean}

    HourEntryRequest:
      type: object
      required: [work_date, hours]
      properties:
        employee_id: {type: string}
        work_date: {type: string, format: date, example: '2026-10-12'}
        hours: {type: number}
        project_id: {type: string, nullable: true}
        note: {type: string}
        version: {type: integer, description: PATCH only — optimistic concurrency token}

    Project:
      type: object
      required: [id, organization_id, name, version, created_at, updated_at]
      properties:
        id: {type: string}
        organization_id: {type: string}
        name: {type: string}
        client_name: {type: string}
        version: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    ProjectPage:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Project'}
        next_cursor: {type: string}
        has_more: {type: boolean}

    ProjectRequest:
      type: object
      required: [name]
      properties:
        name: {type: string}
        client_name: {type: string}
        version: {type: integer, description: PATCH only — optimistic concurrency token}

    PayPeriodCadence:
      type: string
      enum: [Monthly, TwiceInMonth, Weekly]

    PayPeriodDefinition:
      type: object
      required: [id, organization_id, name, cadence, anchor_day, version, created_at, updated_at]
      properties:
        id: {type: string}
        organization_id: {type: string}
        name: {type: string}
        cadence: {$ref: '#/components/schemas/PayPeriodCadence'}
        anchor_day:
          type: integer
          description: Day-of-month for Monthly (1-31, clamped), weekday 0=Sunday for Weekly; ignored for TwiceInMonth
        version: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    PayPeriodDefinitionPage:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/PayPeriodDefinition'}
        next_cursor: {type: string}
        has_more: {type: boolean}

    PayPeriodDefinitionRequest:
      type: object
      required: [name, cadence]
      properties:
        name: {type: string}
        cadence: {$ref: '#/components/schemas/PayPeriodCadence'}
        anchor_day: {type: integer, default: 1}
        version: {type: integer, description: PATCH only — optimistic concurrency token}

    PayPeriodStatus:
      type: string
      enum: [Open, Submitted, Approved, Rejected, Reopened]

    PayPeriod:
      type: object
      required: [id, organization_id, definition_id, period_start, period_end, status, version, created_at, updated_at]
      properties:
        id: {type: string}
        organization_id: {type: string}
        definition_id: {type: string}
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
        status: {$ref: '#/components/schemas/PayPeriodStatus'}
        version: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    PayPeriodPage:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/PayPeriod'}
        next_cursor: {type: string}
        has_more: {type: boolean}

    VersionRequest:
      type: object
      required: [version]
      properties:
        version: {type: integer, description: Optimistic concurrency token}

    ScheduleKind:
      type: string
      enum: [Fixed, Flexible, Weekly]

    Schedule:
      type: object
      required: [id, organization_id, employee_id, kind, expected_daily_hours, version, created_at, updated_at]
      properties:
        id: {type: string}
        organization_id: {type: string}
        employee_id: {type: string}
        kind: {$ref: '#/components/schemas/ScheduleKind'}
        expected_daily_hours: {type: number}
        version: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    SchedulePage:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Schedule'}
        next_cursor: {type: string}
        has_more: {type: boolean}

    ScheduleRequest:
      type: object
      required: [kind]
      properties:
        employee_id: {type: string}
        kind: {$ref: '#/components/schemas/ScheduleKind'}
        expected_daily_hours: {type: number, default: 8}
        version: {type: integer, description: PATCH only — optimistic concurrency token}

    Shift:
      type: object
      required: [id, organization_id, employee_id, shift_date, starts_at, ends_at, published, version, created_at, updated_at]
      properties:
        id: {type: string}
        organization_id: {type: string}
        employee_id: {type: string}
        shift_date: {type: string, format: date, example: '2026-10-19'}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        published: {type: boolean}
        version: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    ShiftPage:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Shift'}
        next_cursor: {type: string}
        has_more: {type: boolean}

    ShiftRequest:
      type: object
      required: [shift_date, starts_at, ends_at]
      properties:
        employee_id: {type: string}
        shift_date: {type: string, format: date, example: '2026-10-19'}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        published: {type: boolean}
        version: {type: integer, description: PATCH only — optimistic concurrency token}

    OvertimeRules:
      type: object
      required: [daily_threshold_hours, double_threshold_hours, weekly_threshold_hours, overtime_mult, double_mult, rest_day_mult, holiday_mult]
      properties:
        daily_threshold_hours: {type: number, description: Regular hours/day before 1.5x; <=0 disables the tier}
        double_threshold_hours: {type: number, description: Hours/day before 2x; <= daily disables the tier}
        weekly_threshold_hours: {type: number, description: Regular hours/ISO-week before weekly 1.5x; <=0 disables}
        overtime_mult: {type: number, example: 1.5}
        double_mult: {type: number, example: 2}
        rest_day_mult: {type: number, example: 2}
        holiday_mult: {type: number, example: 3}

    OvertimeResult:
      type: object
      required: [regular_hours, overtime_15, overtime_2x, rest_day_hours, holiday_hours]
      properties:
        regular_hours: {type: number}
        overtime_15: {type: number, description: Hours at overtime_mult (daily tier + weekly overflow)}
        overtime_2x: {type: number, description: Hours at double_mult}
        rest_day_hours: {type: number, description: Weekend hours at rest_day_mult}
        holiday_hours: {type: number, description: Public-holiday hours at holiday_mult}

    OvertimePreviewRequest:
      type: object
      required: [from, to, rules]
      properties:
        employee_id: {type: string, description: Defaults to the caller's employee; members may only name themselves}
        from: {type: string, format: date, example: '2026-10-01'}
        to: {type: string, format: date, example: '2026-11-01', description: Exclusive}
        rules: {$ref: '#/components/schemas/OvertimeRules'}
        holidays:
          type: array
          items: {type: string, format: date}
          description: Public holidays as YYYY-MM-DD

    OvertimePreviewResponse:
      type: object
      required: [employee_id, from, to, entries, result]
      properties:
        employee_id: {type: string}
        from: {type: string}
        to: {type: string}
        entries: {type: integer, description: Number of entries the preview ran over}
        result: {$ref: '#/components/schemas/OvertimeResult'}
